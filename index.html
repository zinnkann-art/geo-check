<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Geo-Check">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1B22" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Geo-Check Amerika</title>
<style>
/* Layout: Atlas-Look in der Bauweise von „Roadtrip USA“. Kühles Kartenpapier, Navy-Schrift,
   Petrol für Aktionen, Senfgelb markiert die gefragte Nummer. Kategorie-Farben wie auf dem
   Arbeitsblatt (Staaten pink, Städte violett, Gewässer blau). Querformat mit Seitenleiste,
   schmale Fenster mit Tab-Leiste unten. */
:root {
  --bg: #EEF3F1;
  --surface: #FFFFFF;
  --surface-2: #E3EBE8;
  --line: #D0DCD8;
  --ink: #17324A;
  --ink-2: #4F6676;
  --primary: #1F7A8C;
  --primary-ink: #FFFFFF;
  --primary-soft: #D6ECEF;
  --mustard: #E09A2D;
  --mustard-soft: #FBEACB;
  --good: #2D8A4E;
  --good-soft: #DCF0E2;
  --bad: #C62828;
  --bad-soft: #F8DEDB;
  --k-staaten: #C2457A;
  --k-staedte: #6E4FC4;
  --k-gewaesser: #2471B8;
  --k-gebirge: #8A5A2B;
  --k-meere: #137C7A;
  --k-landschaften: #5E7330;
  --map-filter: none;
  --map-paper: #FFFFFF;
  --tag-halo: #FFFFFF;
  --shadow: 0 1px 2px rgba(23, 50, 74, .08), 0 6px 20px rgba(23, 50, 74, .07);
  --radius: 18px;
  --radius-s: 12px;
  --font-display: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1B22;
    --surface: #15262F;
    --surface-2: #1D323C;
    --line: #2A4450;
    --ink: #EAF1F2;
    --ink-2: #A3B6BD;
    --primary: #4FB8C9;
    --primary-ink: #0A1A20;
    --primary-soft: #17414A;
    --mustard: #F2B85A;
    --mustard-soft: #3E321C;
    --good: #5CC384;
    --good-soft: #173A2A;
    --bad: #F2726B;
    --bad-soft: #43201F;
    --k-staaten: #F07FAE;
    --k-staedte: #AE96F2;
    --k-gewaesser: #6FB0F0;
    --k-gebirge: #D6A572;
    --k-meere: #4FC7C4;
    --k-landschaften: #A7BC6C;
    --map-filter: invert(.88) hue-rotate(180deg);
    --map-paper: #1E2628;
    --tag-halo: #1E2628;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0E1B22;
  --surface: #15262F;
  --surface-2: #1D323C;
  --line: #2A4450;
  --ink: #EAF1F2;
  --ink-2: #A3B6BD;
  --primary: #4FB8C9;
  --primary-ink: #0A1A20;
  --primary-soft: #17414A;
  --mustard: #F2B85A;
  --mustard-soft: #3E321C;
  --good: #5CC384;
  --good-soft: #173A2A;
  --bad: #F2726B;
  --bad-soft: #43201F;
  --k-staaten: #F07FAE;
  --k-staedte: #AE96F2;
  --k-gewaesser: #6FB0F0;
  --k-gebirge: #D6A572;
  --k-meere: #4FC7C4;
  --k-landschaften: #A7BC6C;
  --map-filter: invert(.88) hue-rotate(180deg);
  --map-paper: #1E2628;
  --tag-halo: #1E2628;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

/* ---------- Grundlagen ---------- */
html { font-size: 18px; height: 100%; -webkit-text-size-adjust: 100%; }
html[data-font="S"] { font-size: 16px; }
html[data-font="L"] { font-size: 20px; }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 var(--font-body);
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; margin: 0; text-wrap: balance; }
p { margin: 0; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; border-radius: 6px; }
.i { flex: none; }
[hidden] { display: none !important; }

/* Kategorie-Farben */
.kat-staaten { --kc: var(--k-staaten); }
.kat-staedte { --kc: var(--k-staedte); }
.kat-gewaesser { --kc: var(--k-gewaesser); }
.kat-gebirge { --kc: var(--k-gebirge); }
.kat-meere { --kc: var(--k-meere); }
.kat-landschaften { --kc: var(--k-landschaften); }
.kat-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--kc); flex: none; margin-right: 8px; vertical-align: 0; }

/* Beschriftung wie auf der Karte: Nummer oder Buchstabe */
.lbl {
  display: inline-grid;
  place-items: center;
  min-width: 2.2em;
  height: 2.2em;
  padding: 0 .45em;
  border-radius: 99px;
  font: 800 .9rem/1 var(--font-display);
  color: var(--kc, var(--ink));
  background: color-mix(in srgb, var(--kc, var(--ink)) 14%, var(--surface));
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--kc, var(--ink)) 45%, transparent);
  flex: none;
  font-variant-numeric: tabular-nums;
}
.lbl-big { font-size: 1.3rem; }
.lbl-q { font-size: 1.15em; vertical-align: .05em; }
.hl { color: var(--primary); }

/* ---------- App-Gerüst ---------- */
#app {
  height: 100%;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "main" "nav";
}
#main {
  grid-area: main;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}
.nav {
  grid-area: nav;
  display: flex;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-left)) env(safe-area-inset-bottom) max(8px, env(safe-area-inset-right));
}
.nav .brand { display: none; }
.nav a {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 60px;
  color: var(--ink-2);
  text-decoration: none;
  font-size: .72rem;
  font-weight: 600;
  -webkit-touch-callout: none;
}
.nav a .nl { display: none; }
.nav a[aria-current="page"] { color: var(--primary); }
.nav a:active { opacity: .7; }

@media (min-width: 900px) {
  #app { grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "nav main"; }
  .nav {
    flex-direction: column;
    gap: 4px;
    border-top: 0;
    border-right: 1px solid var(--line);
    padding: 20px 12px max(20px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  }
  .nav .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; font: 800 1.1rem/1.1 var(--font-display); }
  .nav a { flex: none; flex-direction: row; justify-content: flex-start; gap: 14px; padding: 0 14px; min-height: 54px; border-radius: 14px; font-size: 1rem; }
  .nav a .nl { display: inline; }
  .nav a .ns { display: none; }
  .nav a[aria-current="page"] { background: var(--primary-soft); }
}
#app.focus { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "main"; }
#app.focus .nav { display: none; }
#app.focus #main { overflow: hidden; }

.brand-mark { width: 36px; height: 36px; flex: none; }
.brand-mark .bm-ring { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 2.5; }
.brand-mark .bm-n { fill: var(--primary); }
.brand-mark .bm-s { fill: var(--mustard); }
.brand-mark .bm-c { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }

.page {
  max-width: 1180px;
  margin: 0 auto;
  padding: max(20px, env(safe-area-inset-top)) clamp(16px, 4vw, 40px) 48px;
  display: grid;
  gap: 20px;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.topbar h1 { font-size: clamp(1.6rem, 3.5vw, 2.1rem); font-weight: 800; }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--ink-2); }
.small { font-size: .86rem; }
.h2-sm { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; }

/* ---------- Bedienelemente ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
  padding: 0 22px;
  border: 0;
  border-radius: 14px;
  font-weight: 700;
  font-size: 1rem;
  text-decoration: none;
  transition: transform .12s ease, background-color .2s ease, opacity .2s ease;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-big { min-height: 64px; font-size: 1.12rem; padding: 0 28px; border-radius: 16px; }
.btn-sm { min-height: 44px; padding: 0 14px; font-size: .9rem; }
.btn-block { width: 100%; }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn-danger.is-armed { background: var(--bad); color: #fff; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border: 0;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--ink);
  flex: none;
}
.icon-btn:active { transform: scale(.94); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: clamp(18px, 3vw, 26px);
  min-width: 0;
}
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > span { display: block; height: 100%; width: var(--p, 0%); background: var(--primary); border-radius: inherit; transition: width .35s ease; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 14px; max-width: 100%; }
.seg button, .seg a { min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; font-size: .92rem; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.seg button small { font-weight: 600; color: var(--ink-2); font-size: .78em; }
.seg [aria-pressed="true"], .seg [aria-selected="true"] { background: var(--surface); box-shadow: var(--shadow); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; }
.toggle { width: 64px; height: 38px; border-radius: 99px; border: 0; background: var(--line); position: relative; flex: none; transition: background-color .2s ease; }
.toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 30px; height: 30px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); transition: transform .2s ease; }
.toggle[aria-pressed="true"] { background: var(--good); }
.toggle[aria-pressed="true"]::after { transform: translateX(26px); }

.field { display: grid; gap: 6px; }
.field label { font-weight: 700; font-size: .9rem; }
.input {
  min-height: 52px;
  padding: 0 16px;
  border-radius: 12px;
  border: 2px solid var(--line);
  background: var(--surface);
  font-size: max(16px, 1rem);
  width: 100%;
}
.input:focus { border-color: var(--primary); outline: none; }
.input-big { min-height: 60px; font: 700 max(18px, 1.2rem)/1.2 var(--font-display); }
.input.is-right { border-color: var(--good); background: var(--good-soft); }
.input.is-fast { border-color: var(--mustard); background: var(--mustard-soft); }
.input.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
textarea.input { padding: 12px 16px; min-height: 120px; line-height: 1.45; resize: vertical; }

.st-chip { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .78rem; font-weight: 800; background: var(--surface-2); color: var(--ink-2); }
.st-chip.st-sicher { background: var(--good-soft); color: var(--good); }
.st-chip.st-wackelig { background: var(--mustard-soft); color: var(--ink); }
.st-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 2px var(--line); }
.st-dot.st-sicher { background: var(--good); box-shadow: none; }
.st-dot.st-wackelig { background: var(--mustard); box-shadow: none; }
.falle { display: flex; gap: 8px; align-items: flex-start; padding: 10px 14px; border-radius: 12px; background: var(--mustard-soft); font-size: .95rem; }
.falle .i { color: var(--mustard); margin-top: 1px; }

/* ---------- Start ---------- */
.welcome { display: grid; gap: 14px; background: var(--mustard-soft); box-shadow: none; }
.welcome h2 { font-size: 1.5rem; }
.hero { display: grid; gap: 22px; }
.hero-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px; }
.countdown { display: grid; gap: 6px; flex: 1 1 280px; min-width: 0; }
.cd-big { font: 800 clamp(2rem, 6vw, 3rem)/1.05 var(--font-display); letter-spacing: -.01em; }
.ring-meter { flex: none; }
.ring-meter .rm-bg { fill: none; stroke: var(--surface-2); stroke-width: 12; }
.ring-meter .rm-fg { fill: none; stroke: var(--primary); stroke-width: 12; stroke-linecap: round; }
.ring-meter .rm-num { fill: var(--ink); font: 800 26px/1 var(--font-display); text-anchor: middle; }
.ring-meter .rm-sub { fill: var(--ink-2); font: 700 12px/1 var(--font-body); text-anchor: middle; letter-spacing: .08em; text-transform: uppercase; }
.next-box { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 18px; border-radius: 16px; background: var(--primary-soft); }
.next-box > div { display: grid; gap: 6px; flex: 1 1 300px; min-width: 0; }
.next-box h2 { font-size: clamp(1.3rem, 3vw, 1.6rem); font-weight: 800; }
.areas { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.area { display: grid; gap: 12px; color: inherit; text-decoration: none; align-content: start; }
.area:active { transform: scale(.99); }
.area-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.area h3 { font-size: 1.3rem; font-weight: 800; }
.area-pct { font: 800 1.4rem/1 var(--font-display); color: var(--primary); font-variant-numeric: tabular-nums; }
.stack-bar { display: flex; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.stack-bar span { width: var(--w); height: 100%; }
.stack-bar .sb-s { background: var(--good); }
.stack-bar .sb-w { background: var(--mustard); }
.tiles { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.tile { display: grid; gap: 10px; align-content: start; }
.tile .big { font: 800 1.9rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.tile .btn { justify-self: stretch; padding: 10px 16px; text-align: center; }

/* ---------- Karten-Seite ---------- */
.sum { display: grid; gap: 18px; }
.sum-main { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; }
.sum-txt { display: grid; gap: 4px; flex: 1 1 260px; min-width: 0; }
.sum-txt strong { font-size: 1.15rem; }
.cat-stats { display: grid; gap: 12px 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); }
.cs { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 0; }
.cs .bar { grid-column: 1 / -1; height: 8px; }
.cs .bar > span { background: var(--kc, var(--primary)); }
.cs-name { font-weight: 700; }
.cs-num { font: 700 .9rem/1 var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.karte-grid { display: grid; gap: 20px; }
.karte-side { display: grid; gap: 20px; align-content: start; }
@media (min-width: 820px) and (max-width: 1399px) { .karte-side { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
@media (min-width: 1400px) { .karte-grid { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; } }
.map-card { display: grid; gap: 14px; padding: clamp(12px, 2vw, 20px); }
.map-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.cat-seg button { padding: 0 12px; }
.pt-info { display: grid; gap: 10px; min-height: 92px; align-content: start; }
.pi-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.pi-head h3 { font-size: 1.5rem; font-weight: 800; }
@media (max-width: 560px) { .pi-head { grid-template-columns: auto minmax(0, 1fr); } .pi-head .speak { grid-column: 1 / -1; justify-self: start; } }
.speak { min-height: 46px; padding: 0 16px; font-size: .92rem; }
.modes { display: grid; gap: 12px; align-content: start; }
.modes h2, .list-card h2 { font-size: 1.3rem; font-weight: 800; }
.mode-list { display: grid; gap: 10px; }
.mode { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 72px; padding: 10px 14px; border-radius: 14px; background: var(--surface-2); color: inherit; text-decoration: none; }
.mode:active { transform: scale(.99); }
.mode .t { display: block; font-weight: 800; }
.mode .s { display: block; font-size: .84rem; color: var(--ink-2); }
.mode .icon-sm { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
.mode.is-off { opacity: .45; pointer-events: none; }
.list-card { display: grid; gap: 10px; align-content: start; }
.pt-list { display: grid; gap: 6px; }
.pl-head { display: flex; align-items: center; font-weight: 800; padding: 10px 2px 2px; }
.pl-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; min-height: 50px; padding: 6px 12px 6px 8px; border: 0; border-radius: 12px; background: var(--surface-2); text-align: left; }
.pl-row:active { transform: scale(.995); }
.pl-row.is-sel { box-shadow: inset 0 0 0 3px var(--primary); }
.pl-name { font-weight: 700; }
.cover { display: inline-block; padding: 3px 12px; border-radius: 99px; background: var(--line); color: var(--ink-2); font-size: .8rem; font-weight: 700; }

/* ---------- Stumme Karte ---------- */
.atlas { display: grid; gap: 6px; min-width: 0; }
.atlas-view {
  position: relative;
  width: min(100%, calc(var(--maxh, 76vh) * var(--ar)));
  aspect-ratio: var(--ar);
  margin-inline: auto;
  overflow: hidden;
  border-radius: 14px;
  background: var(--map-paper);
  box-shadow: inset 0 0 0 1px var(--line);
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.atlas-stage { position: absolute; inset: 0; transform-origin: 0 0; will-change: transform; }
.atlas-img { position: absolute; inset: 0; width: 100%; height: 100%; filter: var(--map-filter); pointer-events: none; -webkit-user-drag: none; }
.atlas-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.atlas.is-tappable .atlas-view { cursor: pointer; }
.atlas.is-zoomed .atlas-view { cursor: grab; }
.atlas-tools { position: absolute; top: 8px; right: 8px; display: grid; gap: 6px; z-index: 2; }
.tool { width: 44px; height: 44px; border: 0; border-radius: 12px; display: grid; place-items: center; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tool:active { transform: scale(.94); }

/* Punkte: unsichtbar, bis sie gebraucht werden */
.pt .pt-ring { fill: none; stroke: transparent; stroke-width: 5; }
.pt .pt-st { fill: transparent; }
.pt.is-cat .pt-ring { stroke: var(--kc); stroke-width: 3; stroke-dasharray: 6 5; opacity: .75; }
.pt.is-sel .pt-ring { stroke: var(--primary); stroke-width: 6; stroke-dasharray: none; opacity: 1; fill: color-mix(in srgb, var(--primary) 14%, transparent); }
.pt.is-ask .pt-ring { stroke: var(--mustard); stroke-width: 7; fill: color-mix(in srgb, var(--mustard) 22%, transparent); animation: askpulse 1.6s ease-in-out infinite; }
.pt.is-right .pt-ring { stroke: var(--good); stroke-width: 7; fill: color-mix(in srgb, var(--good) 20%, transparent); animation: none; }
.pt.is-wrong .pt-ring { stroke: var(--bad); stroke-width: 7; fill: color-mix(in srgb, var(--bad) 18%, transparent); animation: none; }
.pt.is-fastring .pt-ring { stroke: var(--mustard); stroke-width: 7; fill: color-mix(in srgb, var(--mustard) 20%, transparent); animation: none; }
.pt.is-target .pt-ring { stroke: var(--good); stroke-width: 7; fill: color-mix(in srgb, var(--good) 20%, transparent); animation: askpulse 1s ease-in-out 3; }
.pt.st-sicher .pt-st { fill: var(--good); stroke: var(--map-paper); stroke-width: 2.5; }
.pt.st-wackelig .pt-st { fill: var(--mustard); stroke: var(--map-paper); stroke-width: 2.5; }
@keyframes askpulse { 50% { stroke-opacity: .35; } }
.tag { font: 800 25px/1 var(--font-display); fill: var(--kc); paint-order: stroke; stroke: var(--tag-halo); stroke-width: 7px; stroke-linejoin: round; pointer-events: none; }

/* Lupe */
.lupe { position: relative; width: 100%; max-width: 420px; overflow: hidden; border-radius: 14px; background: var(--map-paper); box-shadow: inset 0 0 0 2px var(--line); }
.lupe img { position: absolute; max-width: none; filter: var(--map-filter); pointer-events: none; }
.lupe svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.lupe .tag { font-size: 19px; stroke-width: 6px; }
.lupe-tag { position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 8px; background: var(--surface); color: var(--ink-2); font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; box-shadow: var(--shadow); }

/* ---------- Vollbild-Ablauf (Runner) ---------- */
.runner {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
.rn-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left));
}
.rn-title { display: grid; gap: 6px; min-width: 0; }
.rn-title .eyebrow { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rn-count { font: 700 .9rem/1 var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 3.5em; text-align: right; }
.rn-body { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 8px clamp(16px, 4vw, 40px) 28px; }
.rn-inner { max-width: 820px; margin: 0 auto; display: grid; gap: 18px; }
.runner.is-wide .rn-inner { max-width: 1320px; }
.runner.has-sheet .rn-body { padding-bottom: 320px; }
.rn-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.rn-foot .spacer { flex: 1; }
.rn-foot:empty { display: none; }
.badges { display: flex; flex-wrap: wrap; gap: 8px; }
.badge-retry, .badge-part { font-size: .78rem; font-weight: 800; padding: 4px 10px; border-radius: 99px; }
.badge-retry { background: var(--mustard-soft); color: var(--ink); }
.badge-part { background: var(--ink); color: var(--bg); }

/* Rückmeldung */
.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 5;
  background: var(--surface);
  border-top: 6px solid var(--good);
  box-shadow: 0 -10px 30px rgba(0, 0, 0, .15);
  padding: 20px max(20px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  transform: translateY(105%);
  visibility: hidden;
  transition: transform .28s cubic-bezier(.2, .9, .3, 1), visibility 0s linear .28s;
}
.sheet.show { transform: none; visibility: visible; transition: transform .28s cubic-bezier(.2, .9, .3, 1); }
.sheet.is-bad { border-top-color: var(--bad); }
.sheet.is-fast { border-top-color: var(--mustard); }
.sheet-inner { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; align-items: start; }
.sheet .mark { grid-row: span 3; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--good); color: #fff; }
.sheet.is-bad .mark { background: var(--bad); }
.sheet.is-fast .mark { background: var(--mustard); color: #1D2A33; }
.sheet h3 { font-size: 1.35rem; font-weight: 800; color: var(--good); }
.sheet.is-bad h3 { color: var(--bad); }
.sheet.is-fast h3 { color: var(--ink); }
.sheet .sol { font-weight: 700; }
.sheet .why { color: var(--ink-2); }
.sheet .act { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: 10px; }
/* Bei Karten-Aufgaben auf breiten Bildschirmen: Rückmeldung als Karte rechts, die Karte bleibt sichtbar */
@media (min-width: 1000px) {
  .runner.is-wide .sheet { left: auto; right: 24px; bottom: 24px; width: min(460px, 38%); border-top: 0; border-left: 6px solid var(--good); border-radius: 18px; padding: 20px 22px; }
  .runner.is-wide .sheet.is-bad { border-left-color: var(--bad); }
  .runner.is-wide .sheet.is-fast { border-left-color: var(--mustard); }
  .runner.is-wide.has-sheet .rn-body { padding-bottom: 28px; }
  .runner.is-wide.has-sheet .mq-side { padding-bottom: 300px; }
}

/* ---------- Aufgaben ---------- */
.q { font: 800 clamp(1.3rem, 3vw, 1.65rem)/1.3 var(--font-display); text-wrap: balance; }
.q-help { color: var(--ink-2); font-size: .92rem; }
.choices { display: grid; gap: 12px; }
@media (min-width: 700px) { .choices { grid-template-columns: 1fr 1fr; } }
.choice {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 72px;
  padding: 12px 18px;
  border-radius: 16px;
  border: 2px solid var(--line);
  background: var(--surface);
  font-size: 1.08rem;
  font-weight: 600;
  text-align: left;
  transition: transform .12s ease, border-color .2s ease, background-color .2s ease;
}
.choice:active:not(:disabled) { transform: scale(.98); }
.choice:disabled { cursor: default; }
.choice .key { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; font: 700 .8rem/1 var(--font-mono); background: var(--surface-2); color: var(--ink-2); }
.choice.is-right { border-color: var(--good); background: var(--good-soft); }
.choice.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.is-right .key { background: var(--good); color: #fff; }
.choice.is-wrong .key { background: var(--bad); color: #fff; }

/* Karten-Aufgaben: schmal Frage oben, breit Karte links */
.mq { display: grid; gap: 16px; grid-template-areas: "side" "map"; }
.mq-side { grid-area: side; display: grid; gap: 14px; align-content: start; min-width: 0; }
.mq-map { grid-area: map; min-width: 0; }
.mq .choices.one { grid-template-columns: 1fr 1fr; }
.mq .choice { min-height: 60px; font-size: 1rem; padding: 10px 14px; }
.mq-lupe .lupe { max-width: none; }
@media (max-width: 699px) { .mq-lupe .lupe { max-width: 340px; } }
@media (min-width: 1000px) {
  .mq { grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); grid-template-areas: "map side"; align-items: start; }
  .mq .atlas { --maxh: calc(100vh - 210px); }
  .mq .choices.one { grid-template-columns: 1fr; }
}

/* Richtig/Falsch-Wischkarte */
.swipe-area { display: grid; place-items: center; padding: 10px 0; }
.swipe-card {
  position: relative;
  width: min(100%, 560px);
  min-height: 230px;
  display: grid;
  place-items: center;
  padding: 36px 28px;
  background: var(--surface);
  border-radius: 22px;
  box-shadow: var(--shadow);
  border: 2px solid var(--line);
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
  will-change: transform;
}
.swipe-card.anim { transition: transform .3s ease, opacity .3s ease; }
.swipe-card .sc-text { font: 800 clamp(1.25rem, 3.2vw, 1.65rem)/1.3 var(--font-display); text-align: center; text-wrap: balance; }
.sc-tag { position: absolute; top: 14px; padding: 4px 12px; border-radius: 8px; font-weight: 800; font-size: .9rem; opacity: 0; border: 2px solid currentColor; }
.sc-tag.left { left: 14px; color: var(--bad); transform: rotate(-8deg); }
.sc-tag.right { right: 14px; color: var(--good); transform: rotate(8deg); }
.swipe-card.is-right { border-color: var(--good); }
.swipe-card.is-wrong { border-color: var(--bad); }
.two-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.swipe-hint { text-align: center; color: var(--ink-2); font-size: .86rem; }

/* Sortieren */
.baskets { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 12px; }
.basket { min-height: 150px; border-radius: 16px; border: 2.5px dashed var(--line); background: var(--surface); padding: 10px; display: grid; align-content: start; gap: 8px; transition: border-color .15s ease, background-color .15s ease; }
.basket .b-title { font: 800 1.05rem/1.2 var(--font-display); text-align: center; padding: 6px 4px 8px; }
.basket .b-items { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.basket.is-over, .basket.is-armed { border-color: var(--primary); background: var(--primary-soft); }
.basket.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 60px; }
.chip { min-height: 52px; padding: 0 18px; border-radius: 26px; border: 2px solid var(--line); background: var(--surface); font-weight: 700; touch-action: none; }
.chip.is-sel { border-color: var(--primary); background: var(--primary-soft); }
.chip.is-placed { min-height: 40px; padding: 0 12px; font-size: .88rem; border-color: var(--good); background: var(--good-soft); cursor: default; }
.chip.is-dragging { opacity: .3; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; box-shadow: 0 12px 30px rgba(0, 0, 0, .25); border-color: var(--primary); }

/* Lückentext */
.gap-text { font-size: 1.2rem; line-height: 2.5; }
.gap { display: inline-flex; align-items: center; justify-content: center; min-width: 110px; min-height: 46px; margin: 0 4px; padding: 0 14px; vertical-align: middle; border: 0; border-bottom: 3px dashed var(--ink-2); border-radius: 10px 10px 4px 4px; background: var(--surface-2); font-weight: 700; line-height: 1.2; }
.gap.is-active { background: var(--primary-soft); border-bottom-color: var(--primary); border-bottom-style: solid; }
.gap.is-filled { background: var(--surface); box-shadow: inset 0 0 0 2px var(--line); border-bottom-style: solid; }
.gap.is-right { background: var(--good-soft); border-bottom-color: var(--good); box-shadow: none; }
.gap.is-wrong { background: var(--bad-soft); border-bottom-color: var(--bad); box-shadow: none; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.bank .chip { touch-action: manipulation; }
.bank .chip.is-used { visibility: hidden; }

/* Reihenfolge */
.tl-wrap { display: grid; gap: 20px; }
@media (min-width: 760px) { .tl-wrap { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.tl-pool { display: grid; gap: 10px; align-content: start; }
.tl-chip { touch-action: manipulation; text-align: left; border-radius: 14px; min-height: 56px; padding: 10px 16px; line-height: 1.3; }
.tl-chip.is-used { display: none; }
.tl-chip.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; position: relative; }
.tl::before { content: ""; position: absolute; left: 21px; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--line); }
.tl-slot { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 52px; }
.tl-yr { position: relative; z-index: 1; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); font: 800 1rem/1 var(--font-display); }
.tl-slot .tl-txt { font-weight: 700; }
.tl-slot:not(.is-filled) .tl-txt { height: 14px; width: 70%; border-radius: 7px; background: var(--surface-2); }
.tl-slot.is-filled .tl-yr { background: var(--primary); color: var(--primary-ink); }

/* Offene Fragen */
.checklist { display: grid; gap: 10px; }
.ck-list { display: grid; gap: 8px; }
.ck { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 56px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); text-align: left; font-weight: 600; }
.ck .ck-box { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: transparent; }
.ck[aria-pressed="true"] { border-color: var(--good); background: var(--good-soft); }
.ck[aria-pressed="true"] .ck-box { background: var(--good); color: #fff; }

/* Arbeitsblatt */
.blatt { display: grid; gap: 18px; }
.blatt-map { min-width: 0; }
.blatt-form { display: grid; gap: 14px; align-content: start; min-width: 0; }
@media (min-width: 1000px) {
  .blatt { grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); align-items: start; }
  .blatt-map { position: sticky; top: 0; }
  .blatt .atlas { --maxh: calc(100vh - 200px); }
}
.b-group { border: 0; margin: 0; padding: 14px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 8px; }
.b-group legend { float: left; width: 100%; display: flex; align-items: center; font: 800 1.05rem/1.2 var(--font-display); padding: 0 0 6px; }
.b-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: center; }
.b-row .input { min-height: 46px; padding: 0 12px; }
.b-res { grid-column: 2; display: flex; align-items: center; gap: 6px; font-size: .9rem; }
.b-res:empty { display: none; }
.b-row.is-ok .input { border-color: var(--good); background: var(--good-soft); }
.b-row.is-ok .b-res { color: var(--good); }
.b-row.is-fast .input { border-color: var(--mustard); background: var(--mustard-soft); }
.b-row.is-bad .input { border-color: var(--bad); background: var(--bad-soft); }
.b-sol { font-weight: 800; }
.blatt-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 16px; border-radius: 16px; background: var(--primary-soft); }
.blatt-sum .score { font: 800 2.4rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.blatt-sum p { flex: 1 1 220px; }

/* Karteikarten */
.flash-wrap { perspective: 1400px; display: grid; place-items: center; padding: 6px 0; }
.flash { position: relative; width: min(100%, 580px); aspect-ratio: 5 / 3.2; min-height: 260px; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform .45s ease; touch-action: pan-y; cursor: pointer; }
.flash.is-flipped { transform: rotateY(180deg); }
.flash .face { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 12px; padding: 26px; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); border: 2px solid var(--line); backface-visibility: hidden; -webkit-backface-visibility: hidden; text-align: center; }
.flash .back { transform: rotateY(180deg); background: var(--primary-soft); }
.flash .f-q { font: 800 clamp(1.3rem, 3.6vw, 1.75rem)/1.3 var(--font-display); text-wrap: balance; max-width: 30ch; }
.flash .f-def { font-size: 1.2rem; line-height: 1.45; font-weight: 700; max-width: 34ch; }
.flash .f-hint { font-size: .82rem; color: var(--ink-2); }

/* Infokarten */
.info { display: grid; gap: 16px; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: clamp(22px, 4vw, 36px); touch-action: pan-y; }
.info h2 { font-size: clamp(1.5rem, 3.6vw, 2rem); font-weight: 800; }
.info .txt { font-size: 1.12rem; line-height: 1.6; max-width: 62ch; }
.info-img { width: 150px; height: auto; justify-self: center; }
.merke { display: grid; gap: 4px; padding: 14px 18px; border-radius: 14px; background: var(--mustard-soft); font-weight: 700; }
.merke .eyebrow { color: var(--ink); }
.chain { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 0; }
.chain li { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 800 .9rem/1 var(--font-display); background: var(--surface-2); color: var(--ink-2); position: relative; }
.chain li + li { margin-left: 18px; }
.chain li + li::before { content: ""; position: absolute; right: 100%; width: 18px; height: 3px; background: var(--line); }
.chain li.past { background: color-mix(in srgb, var(--primary) 35%, var(--surface-2)); color: var(--ink); }
.chain li.on { background: var(--primary); color: var(--primary-ink); }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--primary); }
.dots i.seen { background: color-mix(in srgb, var(--primary) 45%, var(--line)); }
.slide-in-l { animation: slidel .28s ease backwards; }
.slide-in-r { animation: slider .28s ease backwards; }
@keyframes slidel { from { transform: translateX(-30px); opacity: 0; } }
@keyframes slider { from { transform: translateX(30px); opacity: 0; } }

/* Ergebnis */
.result { display: grid; gap: 22px; justify-items: center; text-align: center; padding-top: 10px; }
.result h2 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; }
.result .score { font: 800 3.4rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.result .acts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.mistakes { width: 100%; display: grid; gap: 10px; text-align: left; }
.mistakes ul { margin: 0; padding: 0; display: grid; gap: 10px; }
.mistakes li { list-style: none; background: var(--surface); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); display: grid; gap: 4px; }
.final-stations { width: 100%; display: grid; gap: 8px; text-align: left; }
.fs-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.fs-row.is-weak .bar > span { background: var(--bad); }
.fs-nr { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); font: 800 1rem/1 var(--font-display); }
.fs-top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.fs-num { font: 700 .9rem/1 var(--font-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.fs-ok { color: var(--good); display: grid; place-items: center; width: 44px; }

/* ---------- Wetterextreme ---------- */
.wetter-grid { display: grid; gap: 20px; }
@media (min-width: 1100px) { .wetter-grid { grid-template-columns: 1fr 1fr; align-items: start; } }
.topic { display: grid; gap: 18px; }
.topic-head { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; align-items: center; }
.topic-head img { width: 96px; height: 96px; object-fit: contain; }
.topic-head h2 { font-size: 1.6rem; font-weight: 800; }
.topic-head > div { display: grid; gap: 6px; }
.steps { display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 72px; padding: 10px 14px; border-radius: 16px; background: var(--surface-2); color: inherit; text-decoration: none; }
.step:active { transform: scale(.99); }
.step .num { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 800 1.05rem/1 var(--font-display); background: var(--surface); color: var(--ink-2); }
.step.is-done .num { background: var(--good); color: #fff; }
.step.is-next { box-shadow: inset 0 0 0 3px var(--primary); }
.step.is-next .num { background: var(--primary); color: var(--primary-ink); }
.step .t { display: block; font-weight: 800; font-size: 1.05rem; }
.step .s { display: block; font-size: .86rem; color: var(--ink-2); }
.status { font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; white-space: nowrap; background: var(--surface); color: var(--ink-2); }
@media (max-width: 480px) { .step { grid-template-columns: 44px minmax(0, 1fr); } .step .status { grid-column: 2; justify-self: start; } }
.table-wrap { overflow-x: auto; }
table.vgl, table.results { width: 100%; border-collapse: collapse; }
.vgl th, .vgl td, .results th, .results td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.vgl thead th, .results thead th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.vgl tbody th { font-weight: 800; white-space: nowrap; }
.vgl td { min-width: 180px; }
.strike { text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 2px; color: var(--ink-2); }

/* ---------- Generalprobe ---------- */
.probe { display: grid; gap: 18px; }
.probe-head { display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-between; }
.probe-head > div:first-child { display: grid; gap: 8px; flex: 1 1 360px; min-width: 0; max-width: 64ch; }
.probe-head h2 { font-size: 1.5rem; font-weight: 800; }
.probe-best { display: grid; gap: 4px; align-content: start; }
.probe-best .big { font: 800 2.2rem/1 var(--font-display); color: var(--primary); }
.probe .set { display: grid; gap: 8px; justify-items: start; }
.probe .btn-primary { justify-self: start; }

/* ---------- Spickzettel ---------- */
.tab-seg { justify-self: start; }
.spick-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); align-items: start; }
.spick-cat { display: grid; gap: 10px; }
.spick-cat.is-notest { opacity: .7; }
.sp-list { display: grid; gap: 4px; }
.sp-row { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: center; width: 100%; padding: 8px 6px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: default; }
.sp-row .lbl { grid-row: span 2; }
.sp-name { font-weight: 800; }
.sp-info { grid-column: 2; }
.sp-cover { display: none; }
.is-covered .sp-row { cursor: pointer; }
.is-covered .sp-row:not(.is-open) .sp-name, .is-covered .sp-row:not(.is-open) .sp-info { display: none; }
.is-covered .sp-row:not(.is-open) .sp-cover { display: inline-block; justify-self: start; padding: 3px 12px; border-radius: 99px; background: var(--line); color: var(--ink-2); font-size: .8rem; font-weight: 700; }
.spick-topic { display: grid; gap: 16px; }
.spick-topic .topic-head { margin-bottom: 12px; }
.merk-list { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.ablauf { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.ablauf li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; align-items: center; }
.ab-n { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--primary-ink); font: 800 1rem/1 var(--font-display); }
.fallen-t td { vertical-align: middle; }

/* ---------- Einstellungen ---------- */
.set-list { display: grid; gap: 16px; }
.set { display: grid; gap: 12px; }
.set h2 { font-size: 1.15rem; font-weight: 800; }

/* ---------- Sonstiges ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(90px + env(safe-area-inset-bottom));
  transform: translate(-50%, 20px);
  background: var(--ink);
  color: var(--bg);
  padding: 12px 20px;
  border-radius: 14px;
  font-weight: 700;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 100;
  max-width: calc(100% - 32px);
  text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.shake { animation: shake .4s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

rme. Sie bedrohen vor allem die Menschen an den Küsten.","merke":"Hurrikan = tropischer Wirbelsturm. Gefahr vor allem an den Küsten."},{"titel":"Beispiel: Hurrikan Irma","text":"Hurrikan Irma zog 2017 mit Windgeschwindigkeiten von bis zu 300 km/h nach Norden auf die Südspitze Floridas zu. Er verwüstete einige Karibikinseln und setzte Städte wie Miami unter Wasser. Das Ausmaß der Zerstörung war gigantisch.","merke":"Irma: bis zu 300 km/h, Karibikinseln verwüstet, Miami unter Wasser."},{"titel":"Entstehung, Schritt 1: warmes Meer","schritt":1,"text":"Ein Hurrikan braucht warmes Meerwasser: mindestens 26,5 °C. So warm ist das Meer zwischen Juni und November. Das ist die Hurrikan-Saison.","merke":"Mindestens 26,5 °C, zwischen Juni und November."},{"titel":"Entstehung, Schritt 2: Passatwinde","schritt":2,"text":"Hurrikans entstehen dort, wo die Passatwinde wehen: zwischen 5° und 20° nördlich und südlich des Äquators.","merke":"Passatwinde zwischen 5° und 20° nördlicher und südlicher Breite."},{"titel":"Entstehung, Schritt 3: Wolken","schritt":3,"text":"Über dem warmen Meer verdunstet viel Wasser. Der Wasserdampf steigt auf und kondensiert zu Wolken.","merke":"Wasserdampf steigt auf und kondensiert zu Wolken."},{"titel":"Entstehung, Schritt 4: der Wirbel","schritt":4,"text":"Die Passatwinde bringen die Wolken zum Wirbeln. So entsteht ein riesiger Wirbelsturm.","merke":"Die Passatwinde bringen die Wolken zum Wirbeln."},{"titel":"Entstehung, Schritt 5: ab 118 km/h","schritt":5,"text":"Erst ab einer Windgeschwindigkeit von mindestens 118 km/h heißt der Wirbelsturm Hurrikan.","merke":"Ab 118 km/h ist es ein Hurrikan."},{"titel":"Entstehung, Schritt 6: an Land","schritt":6,"text":"Erreicht der Hurrikan das Land, fehlt ihm das warme Meerwasser. Er verliert schnell an Kraft. Trotzdem bringt er noch Stürme und starke Regenfälle.","merke":"An Land verliert er schnell an Kraft, bringt aber Stürme und starke Regenfälle."}],"fragen":[{"f":"Was ist ein Hurrikan?","a":"Ein tropischer Wirbelsturm."},{"f":"Wen bedrohen Hurrikans vor allem?","a":"Die Menschen an den Küsten."},{"f":"Wie warm muss das Meerwasser mindestens sein?","a":"Mindestens 26,5 °C."},{"f":"In welchen Monaten entstehen Hurrikans?","a":"Zwischen Juni und November."},{"f":"Zwischen welchen Breitengraden wehen die Passatwinde, in denen Hurrikans entstehen?","a":"Zwischen 5° und 20° nördlich und südlich des Äquators."},{"f":"Was passiert mit dem Wasserdampf über dem warmen Meer?","a":"Er steigt auf und kondensiert zu Wolken."},{"f":"Was bringt die Wolken zum Wirbeln?","a":"Die Passatwinde."},{"f":"Ab welcher Windgeschwindigkeit spricht man von einem Hurrikan?","a":"Ab mindestens 118 km/h."},{"f":"Was passiert, wenn ein Hurrikan auf Land trifft?","a":"Er verliert schnell an Kraft. Es gibt aber noch Stürme und starke Regenfälle."},{"f":"Wie schnell war Hurrikan Irma?","a":"Bis zu 300 km/h."},{"f":"Welche Schäden richtete Irma an?","a":"Er verwüstete Karibikinseln und setzte Städte wie Miami unter Wasser."}],"ueben":[{"typ":"mc","frage":"Was ist ein Hurrikan?","antworten":["ein tropischer Wirbelsturm","ein Luftwirbel, der nur über Land entsteht","ein Erdbeben unter dem Meer","ein Schneesturm in den Rocky Mountains"],"richtig":0},{"typ":"luecke","text":"Ein Hurrikan entsteht nur, wenn das Meerwasser mindestens {26,5 °C} warm ist. Das ist zwischen {Juni} und {November} der Fall.","extra":["16,5 °C","36,5 °C","Januar","März"]},{"typ":"luecke","text":"Hurrikans entstehen im Bereich der {Passatwinde}, zwischen {5°} und {20°} nördlich und südlich des {Äquators}.","extra":["Westwinde","40°","Nordpols"]},{"typ":"reihenfolge","frage":"Bring die Entstehung eines Hurrikans in die richtige Reihenfolge.","schritte":["Das Meerwasser ist mindestens 26,5 °C warm.","Die Passatwinde wehen zwischen 5° und 20° Breite.","Wasserdampf steigt auf und kondensiert zu Wolken.","Die Passatwinde bringen die Wolken zum Wirbeln.","Ab 118 km/h ist es ein Hurrikan.","An Land verliert der Hurrikan schnell an Kraft."]},{"typ":"tf","aussage":"Ab einer Windgeschwindigkeit von 118 km/h heißt ein Wirbelsturm Hurrikan.","wahr":true},{"typ":"tf","aussage":"Über Land wird ein Hurrikan immer stärker.","wahr":false,"erklaerung":"An Land verliert der Hurrikan schnell an Kraft, weil ihm das warme Meerwasser fehlt. Er bringt aber noch Stürme und starke Regenfälle."},{"typ":"mc","frage":"Mit welcher Windgeschwindigkeit zog Hurrikan Irma auf Florida zu?","antworten":["bis zu 300 km/h","bis zu 118 km/h","bis zu 510 km/h","bis zu 60 km/h"],"richtig":0},{"typ":"karte","karte":"na","kat":"staedte","ziel":"21","frage":"Irma setzte eine große Stadt in Florida unter Wasser. Tippe sie auf der Karte an.","tipp":"Die Stadt liegt ganz im Süden der Halbinsel Florida."},{"typ":"mc","frage":"Wann ist Hurrikan-Saison?","antworten":["von Juni bis November","von Dezember bis März","nur im August","das ganze Jahr gleich stark"],"richtig":0},{"typ":"tf","aussage":"Hurrikans bedrohen vor allem die Menschen an den Küsten.","wahr":true},{"typ":"mc","frage":"Was passiert mit dem Wasserdampf über dem warmen Meer?","antworten":["Er steigt auf und kondensiert zu Wolken.","Er sinkt ab und wird zu Eis.","Er bleibt am Boden liegen.","Er wird von den Passatwinden aufgelöst."],"richtig":0},{"typ":"mc","frage":"Was bringt die Wolken zum Wirbeln?","antworten":["die Passatwinde","die Rocky Mountains","kalte Luft aus dem Norden","der Golfstrom"],"richtig":0},{"typ":"karte","karte":"na","kat":"meere","ziel":"C","frage":"Über dieses warme Meer ziehen viele Hurrikans auf die Küste der USA zu. Tippe es an.","tipp":"Es liegt im Süden der USA, zwischen Texas und Florida."}],"erklaeren":[{"frage":"Erkläre, wie ein Hurrikan entsteht.","punkte":["Meerwasser mindestens 26,5 °C warm (Juni bis November)","Passatwinde zwischen 5° und 20° nördlich und südlich des Äquators","Wasserdampf steigt auf und kondensiert zu Wolken","Passatwinde bringen die Wolken zum Wirbeln","ab 118 km/h spricht man von einem Hurrikan","an Land verliert er schnell an Kraft (Sturm, starker Regen)"]},{"frage":"Beschreibe am Beispiel Irma, welche Folgen ein Hurrikan haben kann.","punkte":["Windgeschwindigkeiten bis zu 300 km/h","Karibikinseln verwüstet","Städte wie Miami unter Wasser gesetzt","riesige Zerstörung, vor allem an den Küsten"]}]},{"id":"to","titel":"Tornados","untertitel":"Wetterextreme in Nordamerika","bild":"tornado.webp","karten":[{"titel":"Was ist ein Tornado?","text":"Tornados sind mächtige Luftwirbel mit Kontakt zum Boden. Sie sind extrem gefährlich, weil sie unberechenbar sind und eine riesige Zerstörungskraft haben. Ein Tornado hält aber nur wenige Sekunden bis zu einer Stunde.","merke":"Luftwirbel mit Bodenkontakt. Unberechenbar, zerstörerisch, dauert Sekunden bis eine Stunde."},{"titel":"Entstehung, Schritt 1: Luftmassen treffen sich","schritt":1,"text":"Feucht-warme Luft vom Meer im Süden (Golf von Mexiko) trifft ungehindert auf trocken-kalte Luft aus den Rocky Mountains im Norden.","merke":"Feucht-warm aus dem Süden trifft auf trocken-kalt aus dem Norden."},{"titel":"Entstehung, Schritt 2: auf und ab","schritt":2,"text":"Die warme Luft steigt auf, die kalte Luft sinkt ab.","merke":"Warme Luft steigt auf, kalte sinkt ab."},{"titel":"Entstehung, Schritt 3: Gewitter","schritt":3,"text":"Es bilden sich mächtige Gewitter und Luftwirbel.","merke":"Mächtige Gewitter und Luftwirbel entstehen."},{"titel":"Entstehung, Schritt 4: Touchdown","schritt":4,"text":"Der Wirbel bildet sich schlauchartig aus den Wolken und berührt den Boden. Das nennt man „Touchdown“.","merke":"Schlauch aus den Wolken berührt den Boden: Touchdown."},{"titel":"Zerstörungspotenzial","text":"Ein Tornado erreicht Windgeschwindigkeiten von bis zu 510 km/h. Dazu kommen Sturm, Hagel und Starkregen. Er reißt alles mit sich, was ihm in den Weg kommt.","merke":"Bis zu 510 km/h, dazu Sturm, Hagel und Starkregen."},{"titel":"Allee der Tornados","text":"Die „Allee der Tornados“ (englisch: Tornado Alley) ist die flache Ebene im Zentrum der USA, die Great Plains. Kein Gebirge hält die Luftmassen dort auf. Deshalb können kalte und warme Luftmassen über weite Strecken ungehindert aufeinandertreffen.","merke":"Tornado-Allee = Great Plains. Keine Gebirge: Kalte und warme Luft treffen ungehindert aufeinander."},{"titel":"Hurrikan oder Tornado?","text":"Ein Hurrikan ist ein tropischer Wirbelsturm über dem warmen Meer. Er wird ab 118 km/h so genannt und verliert an Land an Kraft. Ein Tornado ist ein Luftwirbel mit Bodenkontakt über dem Land. Er entsteht, wenn warme und kalte Luft aufeinandertreffen, und erreicht bis zu 510 km/h.","merke":"Hurrikan: Meer, ab 118 km/h, Irma bis 300 km/h. Tornado: Land, Bodenkontakt, bis 510 km/h."}],"fragen":[{"f":"Was ist ein Tornado?","a":"Ein mächtiger Luftwirbel mit Kontakt zum Boden."},{"f":"Warum sind Tornados so gefährlich?","a":"Wegen ihrer Unberechenbarkeit und ihrer Zerstörungskraft."},{"f":"Wie lange hält ein Tornado?","a":"Wenige Sekunden bis zu einer Stunde."},{"f":"Welche Luft trifft bei der Entstehung aufeinander?","a":"Feucht-warme Luft vom Meer im Süden und trocken-kalte Luft aus den Rocky Mountains im Norden."},{"f":"Was machen die warme und die kalte Luft?","a":"Die warme Luft steigt auf, die kalte sinkt ab."},{"f":"Was bildet sich, wenn die Luftmassen aufeinandertreffen?","a":"Mächtige Gewitter und Luftwirbel."},{"f":"Was ist der „Touchdown“?","a":"Der schlauchartige Wirbel aus den Wolken berührt den Boden."},{"f":"Welche Windgeschwindigkeit kann ein Tornado erreichen?","a":"Bis zu 510 km/h."},{"f":"Was bringt ein Tornado außer Wind noch mit?","a":"Sturm, Hagel und Starkregen. Er reißt alles mit, was ihm in den Weg kommt."},{"f":"Wo liegt die „Allee der Tornados“?","a":"In der flachen Ebene im Zentrum der USA, den Great Plains."},{"f":"Warum gibt es in den Great Plains so viele Tornados?","a":"Kein Gebirge hält die Luftmassen auf: Kalte und warme Luft treffen über weite Strecken ungehindert aufeinander."}],"ueben":[{"typ":"mc","frage":"Was ist ein Tornado?","antworten":["ein mächtiger Luftwirbel mit Kontakt zum Boden","ein tropischer Wirbelsturm über dem Meer","ein starker Regen ohne Wind","ein Sturm, der nur im Winter vorkommt"],"richtig":0},{"typ":"mc","frage":"Wie lange hält ein Tornado?","antworten":["wenige Sekunden bis zu einer Stunde","mehrere Tage","genau einen Tag","zwei Wochen"],"richtig":0},{"typ":"reihenfolge","frage":"Bring die Entstehung eines Tornados in die richtige Reihenfolge.","schritte":["Feucht-warme Luft aus dem Süden trifft auf trocken-kalte Luft aus dem Norden.","Die warme Luft steigt auf, die kalte sinkt ab.","Es bilden sich mächtige Gewitter und Luftwirbel.","Der Wirbel bildet sich schlauchartig aus den Wolken und berührt den Boden."]},{"typ":"luecke","text":"Feucht-{warme} Luft vom Meer im Süden trifft ungehindert auf trocken-{kalte} Luft aus den {Rocky Mountains} im Norden. Die warme Luft {steigt auf}, die kalte Luft {sinkt ab}.","extra":["Appalachen","Anden"]},{"typ":"mc","frage":"Wie nennt man den Moment, in dem der Wirbel den Boden berührt?","antworten":["Touchdown","Countdown","Shutdown","Blackout"],"richtig":0},{"typ":"mc","frage":"Welche Windgeschwindigkeit kann ein Tornado erreichen?","antworten":["bis zu 510 km/h","bis zu 300 km/h","bis zu 118 km/h","bis zu 50 km/h"],"richtig":0},{"typ":"tf","aussage":"Die „Allee der Tornados“ liegt in den Great Plains, der flachen Ebene im Zentrum der USA.","wahr":true},{"typ":"mc","frage":"Warum gibt es in den Great Plains besonders viele Tornados?","antworten":["Kein Gebirge hält die Luftmassen auf. Kalte und warme Luft treffen ungehindert aufeinander.","Dort gibt es besonders hohe Berge.","Das Meer ist dort mindestens 26,5 °C warm.","Dort wehen die Passatwinde."],"richtig":0},{"typ":"tf","aussage":"Tornados sind gut vorhersehbar und deshalb ungefährlich.","wahr":false,"erklaerung":"Tornados sind extrem gefährlich, gerade weil sie so unberechenbar sind."},{"typ":"mc","frage":"Was bringt ein Tornado außer dem starken Wind noch mit?","antworten":["Sturm, Hagel und Starkregen","Schnee und Eis","Hitze und Dürre","Nebel und Frost"],"richtig":0},{"typ":"karte","karte":"na","kat":"landschaften","ziel":"4","frage":"Tippe auf die Landschaft, in der die „Allee der Tornados“ liegt.","tipp":"Die flache Ebene liegt zwischen den Rocky Mountains und dem Mississippi.","erklaerung":"Das sind die Great Plains (Nummer 4). Landschaften werden im Test nicht abgefragt, aber die Great Plains gehören zum Thema Tornados."},{"typ":"karte","karte":"na","kat":"meere","ziel":"C","frage":"Von welchem Meer kommt die feucht-warme Luft für Tornados? Tippe es an.","tipp":"Das Meer liegt südlich der USA."},{"typ":"sortieren","frage":"Hurrikan oder Tornado? Sortiere die Merkmale.","koerbe":["Hurrikan","Tornado"],"karten":[["tropischer Wirbelsturm",0],["Meer mindestens 26,5 °C warm",0],["ab 118 km/h",0],["Irma: bis 300 km/h",0],["verliert an Land schnell an Kraft",0],["Luftwirbel mit Bodenkontakt",1],["bis zu 510 km/h",1],["„Touchdown“",1],["Great Plains",1],["warme und kalte Luft treffen aufeinander",1]]}],"erklaeren":[{"frage":"Erkläre, wie ein Tornado entsteht.","punkte":["feucht-warme Luft vom Meer im Süden trifft auf trocken-kalte Luft aus dem Norden (Rocky Mountains)","die warme Luft steigt auf, die kalte sinkt ab","es bilden sich mächtige Gewitter und Luftwirbel","der Wirbel bildet sich schlauchartig aus den Wolken und berührt den Boden („Touchdown“)"]},{"frage":"Erkläre, warum es in den Great Plains so viele Tornados gibt.","punkte":["die Great Plains sind eine flache Ebene im Zentrum der USA","kein Gebirge hält die Luftmassen auf","kalte und warme Luftmassen treffen über weite Strecken ungehindert aufeinander"]},{"frage":"Vergleiche Hurrikan und Tornado.","punkte":["Hurrikan: tropischer Wirbelsturm, entsteht über warmem Meer (mind. 26,5 °C)","Hurrikan: ab 118 km/h, verliert an Land an Kraft","Tornado: Luftwirbel mit Bodenkontakt über Land","Tornado: bis zu 510 km/h, dauert Sekunden bis eine Stunde"]}]}]}</script>

<script>
/* Geo-Check Amerika – Lern-App für den Erdkunde-Test. Reines JavaScript ohne Abhängigkeiten.
   Bedienung wie bei „Roadtrip USA“: Karten, Vollbild-Abläufe, Rückmeldung von unten. */
(() => {
  'use strict';

  // ---------- Daten ----------
  const DATA = JSON.parse(document.getElementById('inhalte').textContent);
  const IMG = JSON.parse(document.getElementById('bilder').textContent);
  const MAPS = DATA.karten;
  const POINTS = {};
  for (const [mid, m] of Object.entries(MAPS)) {
    m.id = mid;
    m.kat = Object.fromEntries(m.kategorien.map((k) => [k.id, k]));
    for (const p of m.punkte) {
      Object.assign(p, { id: `${mid}.${p.kat}.${p.l}`, map: mid, test: !m.kat[p.kat].ohneTest });
      POINTS[p.id] = p;
    }
  }
  const pid = (mid, kat, l) => `${mid}.${kat}.${l}`;
  const pname = (p) => p.zeige || p.n;
  // Punkte einer Karte: „alle“ = alles, was im Test drankommt; sonst genau eine Kategorie
  const pointsOf = (mid, kat = 'alle') => MAPS[mid].punkte.filter((p) => (kat === 'alle' ? p.test : p.kat === kat));

  const TOPICS = DATA.themen;
  const TOPIC = Object.fromEntries(TOPICS.map((t) => [t.id, t]));
  for (const tp of TOPICS) {
    tp.ueben.forEach((t, i) => Object.assign(t, { key: `${tp.id}.u${i}`, teil: tp.id }));
    tp.fragen.forEach((c, i) => Object.assign(c, { key: `${tp.id}.f${i}` }));
    tp.erklaeren.forEach((t, i) => Object.assign(t, { typ: 'offen', key: `${tp.id}.e${i}`, teil: tp.id }));
  }
  const TASKS = Object.fromEntries(TOPICS.flatMap((tp) => [...tp.ueben, ...tp.erklaeren]).map((t) => [t.key, t]));
  const FALLEN = DATA.fallen.map((f) => ({ ...f, p: POINTS[pid(f.karte, f.kat, f.l)] })).filter((f) => f.p);
  const FALLE = Object.fromEntries(FALLEN.map((f) => [f.p.id, f]));

  const AREAS = [
    { id: 'na', titel: 'Nordamerika', sub: 'Topographie', hash: '#/karte/na' },
    { id: 'sa', titel: 'Südamerika', sub: 'Topographie', hash: '#/karte/sa' },
    { id: 'hu', titel: 'Hurrikans', sub: 'Naturrisiken', hash: '#/wetter' },
    { id: 'to', titel: 'Tornados', sub: 'Wetterextreme', hash: '#/wetter' },
  ];
  const AREA = Object.fromEntries(AREAS.map((a) => [a.id, a]));
  const areaKeys = (id) => (MAPS[id]
    ? pointsOf(id).map((p) => p.id)
    : [...TOPIC[id].ueben, ...TOPIC[id].fragen, ...TOPIC[id].erklaeren].map((x) => x.key));
  const MODES = {
    was: { titel: 'Was ist hier?', text: 'Eine Nummer ist markiert. Wähle den richtigen Namen.', icon: 'quiz' },
    wo: { titel: 'Wo liegt das?', text: 'Ein Name ist vorgegeben. Tippe die passende Nummer auf der Karte an.', icon: 'tap' },
    schreib: { titel: 'Schreiben wie im Test', text: 'Schreib den Namen zur markierten Nummer selbst. Die Schreibweise zählt.', icon: 'pencil' },
    blatt: { titel: 'Arbeitsblatt ausfüllen', text: 'Die ganze stumme Karte auf einmal beschriften, dann auswerten.', icon: 'list' },
  };
  const MAP_TYPES = new Set(['was', 'wo', 'schreib', 'karte']);
  const SICHER = 2; // so viele Punkte braucht es für „sicher“
  const ROUND = 20; // Fragen pro Kartenrunde

  // ---------- Speicher ----------
  const STORE_KEY = 'geo-check-amerika-v1';
  const fresh = () => ({
    version: 1,
    name: '',
    introDone: false,
    examDate: DATA.pruefung.datum,
    items: {}, // je Punkt oder Aufgabe: n = Versuche, s = Sicherheit (0–3), sw = richtig geschrieben
    wrong: {}, // Fehlerliste: Schlüssel → Aufgabentyp
    read: {}, // gelesene Infokarten je Thema
    probe: null, // Generalprobe: { best, last }
    settings: { sound: true, font: 'M', namen: false, decken: false },
  });
  function migrate(d) {
    const b = fresh();
    if (!d || typeof d !== 'object' || d.version !== 1) return b;
    const obj = (x) => (x && typeof x === 'object' ? x : {});
    return { ...b, ...d, items: obj(d.items), wrong: obj(d.wrong), read: obj(d.read), settings: { ...b.settings, ...obj(d.settings) } };
  }
  let S = (() => {
    try {

  function lev(a, b) {
    if (!a.length) return b.length;
    if (!b.length) return a.length;
    let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

      ty = py - (py - ty) * (nk / k);

      clamp();
      apply(anim);
    };
    const toMap = (cx, cy) => {
      const r = box();

    };

      const r = box();

      ty = r.height / 2 - (y / H) * r.height * k;

    };

    });

      const [x, y] = toMap(cx, cy);
      const r = box();
      const unitsPerPx = W / r.width / k;
      const cands = opts.candidates ? opts.candidates() : m.punkte;
      let best = null, bd = Infinity;
      for (const p of cands) {
        let d = Math.hypot(p.x - x, p.y - y);
        if (p.dot) d = Math.min(d, Math.hypot(p.dot[0] - x, p.dot[1] - y));

        const r = box();
        const nk = Math.min(6, Math.max(1, (g.k * Math.hypot(a.x - b.x, a.y - b.y)) / g.d));
        const px = g.mx - r.left, py = g.my - r.top;
        tx = px - (px - g.tx) * (nk / g.k) + ((a.x + b.x) / 2 - g.mx);
        ty = py - (py - g.ty) * (nk / g.k) + ((a.y + b.y) / 2 - g.my);
        k = nk;
        g.moved = true;
        clamp();
        apply(false);
        return;
      }
      const dx = e.clientX - g.x, dy = e.clientY - g.y;
      if (!g.moved && Math.hypot(dx, dy) > 8) g.moved = true;
      if (g.moved && k > 1.01) {
        tx = g.tx + dx;
        ty = g.ty + dy;
        clamp();
        apply(false);
      }
    });
    const up = (e, cancel) => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.delete(e.pointerId);
      if (!g) return;
      if (ptrs.size === 0) {
        const tap = !cancel && !g.moved && !g.multi;
        g = null;
        if (tap && opts.onTap) handleTap(e.clientX, e.clientY);
      } else if (ptrs.size === 1) {
        const [a] = [...ptrs.values()];
        Object.assign(g, { x: a.x, y: a.y, tx, ty });
      }
    };
    view.addEventListener('pointerup', (e) => up(e, false));
    view.addEventListener('pointercancel', (e) => up(e, true));
    view.addEventListener('wheel', (e) => {
      // Mausrad scrollt die Seite; Zoomen mit Strg/Trackpad-Geste oder wenn die Karte schon vergrößert ist
      if (!e.ctrlKey && k <= 1.01) return;
      e.preventDefault();
      zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY, false);
    }, { passive: false });

    const ptEl = (id) => svg.querySelector(`.pt[data-id="${id}"]`);
    return {
      el,
      set(id, cls, on = true) { const n = ptEl(id); if (n) n.classList.toggle(cls, on); },
      clear(...cls) { svg.querySelectorAll('.pt').forEach((n) => n.classList.remove(...cls)); },
      tags(list) { tagsG.innerHTML = list.map((p) => tagSvg(p, W)).join(''); },
      dots(on) {
        svg.querySelectorAll('.pt').forEach((n) => {
          const p = POINTS[n.dataset.id];
          n.classList.remove('st-sicher', 'st-wackelig');
          if (on && p.test && status(p.id) !== 'neu') n.classList.add(`st-${status(p.id)}`);
        });
      },
      focus: (p, nk) => focus(p.dot ? (p.x + p.dot[0]) / 2 : p.x, p.dot ? (p.y + p.dot[1]) / 2 : p.y, nk),
      reset,
      dense: (p) => m.punkte.some((q) => q !== p && Math.hypot(q.x - p.x, q.y - p.y) < 75),
    };
  }

  // Vergrößerter Ausschnitt um einen Punkt (zum Ablesen der Nummer)
  function lupe(p, cls = 'is-ask') {
    const m = MAPS[p.map];
    const [lw, lh] = m.lupe;
    const cx = p.dot ? (p.x + p.dot[0]) / 2 : p.x;
    const cy = p.dot ? (p.y + p.dot[1]) / 2 : p.y;
    const x0 = Math.round(Math.min(m.w - lw, Math.max(0, cx - lw / 2)));
    const y0 = Math.round(Math.min(m.h - lh, Math.max(0, cy - lh / 2)));
    const el = h(`<div class="lupe" style="aspect-ratio:${lw} / ${lh}"><img alt="" draggable="false" style="width:${((m.w / lw) * 100).toFixed(2)}%;height:${((m.h / lh) * 100).toFixed(2)}%;left:${((-x0 / lw) * 100).toFixed(2)}%;top:${((-y0 / lh) * 100).toFixed(2)}%"><svg viewBox="${x0} ${y0} ${lw} ${lh}" aria-hidden="true">${ptSvg(p, cls)}<g class="tags"></g></svg><span class="lupe-tag">Lupe</span></div>`);
    el.querySelector('img').src = IMG[m.bild];
    el.reveal = (state) => {
      const n = el.querySelector('.pt');
      n.classList.remove('is-ask');
      n.classList.add(state);
      el.querySelector('.tags').innerHTML = tagSvg(p, m.w);
    };
    return el;
  }

  // ---------- Grundgerüst ----------
  const NAV = [
    { id: 'start', label: 'Start', kurz: 'Start', icon: 'home' },
    { id: 'na', label: 'Nordamerika', kurz: 'Nord', icon: 'north', hash: 'karte/na' },
    { id: 'sa', label: 'Südamerika', kurz: 'Süd', icon: 'globe', hash: 'karte/sa' },
    { id: 'wetter', label: 'Wetterextreme', kurz: 'Wetter', icon: 'wind' },
    { id: 'pruefung', label: 'Generalprobe', kurz: 'Probe', icon: 'flag' },
    { id: 'spick', label: 'Spickzettel', kurz: 'Spick', icon: 'book' },
  ];
  const app = document.getElementById('app');
  app.innerHTML = `<nav class="nav" aria-label="Hauptmenü"><div class="brand">${brandSvg()}<span>Geo-Check<br>Amerika</span></div>${NAV.map((n) => `<a href="#/${n.hash || n.id}" data-nav="${n.id}">${icon(n.icon)}<span class="nl">${n.label}</span><span class="ns">${n.kurz}</span></a>`).join('')}</nav><main id="main"></main>`;
  const main = $('#main');
  let active = null;

  function applySettings() {
    document.documentElement.dataset.font = ['S', 'M', 'L'].includes(S.settings.font) ? S.settings.font : 'M';
  }
  function go(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  function render() {
    Speech.stop();
    if (active && active.destroy) active.destroy();
    active = null;
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    const [a = 'start', b, c, d, e] = parts;
    let navKey = a;
    let focus = false;
    let view;
    try {
      if (a === 'karte' && MAPS[b]) {
        navKey = b;
        if (c === 'blatt') { focus = true; view = runBlatt(b, d || 'alle'); }
        else if (MODES[c]) { focus = true; view = runMapQuiz(b, c, MAPS[b].kat[d] ? d : 'alle', e); }
        else view = viewKarte(b);
      } else if (a === 'thema' && TOPIC[b]) {
        navKey = 'wetter';
        focus = true;
        view = runThema(TOPIC[b], c);
      } else if (a === 'wetter') view = viewWetter();
      else if (a === 'pruefung') {
        if (b) { focus = true; view = runPruefung(b, c); }
        else view = viewPruefung();
      } else if (a === 'spick') view = viewSpick(b);
      else if (a === 'einstellungen') { navKey = ''; view = viewSettings(); }
      else { navKey = 'start'; view = viewStart(); }
    } catch (err) {
      console.error(err);
      focus = false;
      view = h('<div class="page"><div class="card"><h2>Hoppla</h2><p>Diese Seite konnte nicht geladen werden.</p><p><a class="btn btn-primary" href="#/start">Zum Start</a></p></div></div>');
    }
    if (view instanceof Element) view = { el: view };
    app.classList.toggle('focus', focus);
    for (const l of document.querySelectorAll('.nav a')) {
      if (l.dataset.nav === navKey) l.setAttribute('aria-current', 'page');
      else l.removeAttribute('aria-current');
    }
    main.replaceChildren(view.el);
    main.scrollTop = 0;
    active = view;
    if (view.mount) view.mount();
  }

  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (e.key === 'Escape') {
      const close = document.querySelector('.rn-head .icon-btn');
      if (close) { close.click(); return; }
    }
    if (t.closest && t.closest('input, textarea, select')) return;
    if ((e.key === 'Enter' || e.key === ' ') && t.closest && t.closest('button, a')) return;
    if (active && active.key) active.key(e);
  });

  // ---------- Start ----------
  function countdown() {
    const [y, m, d] = String(S.examDate || DATA.pruefung.datum).split('-').map(Number);
    const exam = new Date(y, (m || 1) - 1, d || 1);
    if (Number.isNaN(exam.getTime())) return null;
    const now = new Date();
    const days = Math.round((exam - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    const datum = exam.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
    const big = days > 1 ? `Noch ${days} Tage` : days === 1 ? 'Morgen ist der Test' : days === 0 ? 'Heute ist der Test' : 'Der Test ist vorbei';
    return { days, datum, big };
  }

  // Was als Nächstes? Der schwächste Bereich mit dem passenden Lernschritt.
  function recommend() {
    const list = AREAS.map((a) => ({ a, st: areaStats(a.id) })).sort((x, y) => x.st.pct - y.st.pct);
    const { a, st } = list[0];
    if (st.pct === 100) {
      return { eyebrow: 'Alles sicher', titel: 'Generalprobe wie im Test', text: 'Du kannst alles. Mach zur Sicherheit die Generalprobe.', hash: '#/pruefung/probe/20', btn: 'Generalprobe starten' };
    }
    if (MAPS[a.id]) {
      const m = MAPS[a.id];
      if (st.neu > st.total / 2) {
        return { eyebrow: `${m.titel} · ${st.pct} % sicher`, titel: `${m.titel}: Was ist hier?`, text: 'Lerne die Nummern auf der stummen Karte kennen. Du wählst den Namen aus vier Vorschlägen.', hash: `#/karte/${a.id}/was/alle/offen`, btn: 'Los geht’s' };
      }
      return { eyebrow: `${m.titel} · ${st.pct} % sicher`, titel: `${m.titel}: Schreiben wie im Test`, text: 'Schreib die Namen selbst. Erst dann gilt ein Ort als sicher.', hash: `#/karte/${a.id}/schreib/alle/offen`, btn: 'Weiterlernen' };
    }
    const tp = TOPIC[a.id];
    const open = (list2) => list2.filter((x) => status(x.key) !== 'sicher').length;
    if (!S.read[tp.id]) return { eyebrow: `${tp.titel} · ${st.pct} % sicher`, titel: `${tp.titel}: Lernen`, text: `${tp.karten.length} kurze Infokarten aus deinem Heft.`, hash: `#/thema/${tp.id}/lernen`, btn: 'Lesen' };
    if (open(tp.fragen) > tp.fragen.length / 2) return { eyebrow: `${tp.titel} · ${st.pct} % sicher`, titel: `${tp.titel}: Karteikarten`, text: 'Frage lesen, Antwort überlegen, Karte umdrehen.', hash: `#/thema/${tp.id}/karten`, btn: 'Karteikarten' };
    if (open(tp.ueben)) return { eyebrow: `${tp.titel} · ${st.pct} % sicher`, titel: `${tp.titel}: Üben`, text: 'Aufgaben wie im Test: auswählen, ordnen, Lücken füllen.', hash: `#/thema/${tp.id}/ueben`, btn: 'Üben' };
    if (open(tp.erklaeren)) return { eyebrow: `${tp.titel} · ${st.pct} % sicher`, titel: `${tp.titel}: Erklären`, text: 'Erkläre in eigenen Worten und hake ab, was du gewusst hast.', hash: `#/thema/${tp.id}/erklaeren`, btn: 'Erklären' };
    return { eyebrow: `${tp.titel} · ${st.pct} % sicher`, titel: `${tp.titel}: Karteikarten`, text: 'Noch einmal durch alle Fragen, bis alles sitzt.', hash: `#/thema/${tp.id}/karten`, btn: 'Karteikarten' };
  }

  function ring(p100, size = 132) {
    const r = 54, c = 2 * Math.PI * r;
    return `<svg class="ring-meter" width="${size}" height="${size}" viewBox="0 0 132 132" role="img" aria-label="${p100} Prozent sicher"><circle class="rm-bg" cx="66" cy="66" r="${r}"/>${p100 > 0 ? `<circle class="rm-fg" cx="66" cy="66" r="${r}" stroke-dasharray="${((c * p100) / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 66 66)"/>` : ''}<text x="66" y="64" class="rm-num">${p100} %</text><text x="66" y="88" class="rm-sub">sicher</text></svg>`;
  }

  function viewStart() {
    const cd = countdown();
    const rec = recommend();
    const wrong = wrongKeys().length;
    const ready = readiness();
    const tiles = AREAS.map((a) => {
      const st = areaStats(a.id);
      return `<a class="card area" href="${a.hash}"><div class="area-top"><div><p class="eyebrow">${esc(a.sub)}</p><h3>${esc(a.titel)}</h3></div><span class="area-pct">${st.pct} %</span></div>
        <div class="stack-bar" aria-hidden="true"><span class="sb-s" style="--w:${pct(st.sicher, st.total)}%"></span><span class="sb-w" style="--w:${pct(st.wackelig, st.total)}%"></span></div>
        <p class="small muted">${st.sicher} sicher · ${st.wackelig} wackelig · ${st.neu} neu</p></a>`;
    }).join('');
    const pr = S.probe;
    const el = h(`<div class="page">
      <header class="topbar"><div><p class="eyebrow">Erdkunde-Test · Amerika</p><h1>${S.name ? `Hallo, ${esc(S.name)}!` : 'Hallo!'}</h1></div>${gearBtn()}</header>
      ${S.introDone ? '' : `<section class="card welcome">
        <h2>Fit für den Erdkunde-Test</h2>
        <p>Hier lernst du alles aus deinem Geo-Heft: die stummen Karten von Nord- und Südamerika und die Themen Hurrikans und Tornados. Alles ist sofort offen. Du kannst alles am Stück lernen oder jederzeit Pause machen.</p>
        <form class="row" style="align-items:end"><div class="field" style="flex:1 1 220px"><label for="name-in">Wie heißt du? (freiwillig)</label><input id="name-in" class="input" maxlength="30" autocomplete="given-name" placeholder="Vorname"></div><button class="btn btn-primary" type="submit">Los geht’s</button></form>
      </section>`}
      <section class="card hero">
        <div class="hero-top">
          <div class="countdown">${cd ? `<p class="eyebrow">Test am ${esc(cd.datum)}</p><p class="cd-big">${esc(cd.big)}</p>` : '<p class="eyebrow">Testtermin</p><p class="cd-big">Datum eintragen</p>'}
            <p class="small muted">Prüfungsreife über alle vier Themen. Das Datum kannst du in den Einstellungen ändern.</p></div>
          ${ring(ready)}
        </div>
        <div class="next-box"><div><p class="eyebrow">Als Nächstes · ${esc(rec.eyebrow)}</p><h2>${esc(rec.titel)}</h2><p class="muted">${esc(rec.text)}</p></div>
          <a class="btn btn-primary btn-big" href="${rec.hash}">${esc(rec.btn)} ${icon('right')}</a></div>
      </section>
      <div class="areas">${tiles}</div>
      <div class="tiles">
        <section class="card tile"><p class="eyebrow">Fehler</p><div class="big">${wrong} <span class="small muted">${wrong === 1 ? 'offene Aufgabe' : 'offene Aufgaben'}</span></div><p class="small muted">${wrong ? 'Alles, was zuletzt nicht geklappt hat.' : 'Gerade ist nichts offen.'}</p>${wrong ? '<a class="btn btn-ghost" href="#/pruefung/fehler">Fehler wiederholen</a>' : ''}</section>
        <section class="card tile"><p class="eyebrow">Generalprobe</p><div class="big">${pr ? `${pct(pr.best, 1)} %` : '–'} <span class="small muted">${pr ? 'bestes Ergebnis' : 'noch nicht gemacht'}</span></div><p class="small muted">Gemischter Test aus allen Themen, ohne Tipps.</p><a class="btn btn-ghost" href="#/pruefung">Zur Generalprobe</a></section>
        <section class="card tile"><p class="eyebrow">Stolperwörter</p><div class="big">${FALLEN.filter((f) => status(f.p.id) === 'sicher').length} <span class="small muted">von ${FALLEN.length} sicher</span></div><p class="small muted">Namen, die auf dem Arbeitsblatt falsch geschrieben waren oder fehlten.</p><a class="btn btn-ghost" href="#/pruefung/fallen">Stolperwörter üben</a></section>
      </div>
    </div>`);
    const form = el.querySelector('form');
    if (form) form.addEventListener('submit', (e) => {
      e.preventDefault();
      S.name = el.querySelector('#name-in').value.trim().slice(0, 30);
      S.introDone = true;
      save();
      render();
    });
    return el;
  }

  // ---------- Karten-Seite ----------
  function viewKarte(mid) {
    const m = MAPS[mid];
    const st = areaStats(mid);
    const sel = { cat: 'alle', offen: false, id: null };
    const revealed = new Set();
    const testCats = m.kategorien.filter((c) => !c.ohneTest);
    const el = h(`<div class="page">
      <header class="topbar"><div><p class="eyebrow">Topographie · stumme Karte</p><h1>${esc(m.titel)}</h1></div>${gearBtn()}</header>
      <section class="card sum">
        <div class="sum-main">${ring(st.pct, 96)}<div class="sum-txt"><p><strong>${st.sicher} von ${st.total}</strong> Orten sicher</p><p class="small muted">${st.wackelig} wackelig · ${st.neu} neu. Sicher heißt: zweimal hintereinander richtig, davon mindestens einmal selbst geschrieben.</p></div></div>
        <div class="cat-stats">${testCats.map((c) => {
          const ps = pointsOf(mid, c.id);
          const s = ps.filter((p) => status(p.id) === 'sicher').length;
          return `<div class="cs kat-${c.id}"><span class="kat-dot"></span><span class="cs-name">${esc(c.label)} <span class="muted small">${esc(c.zeichen)}</span></span><span class="cs-num">${s}/${ps.length}</span><div class="bar"><span style="--p:${pct(s, ps.length)}%"></span></div></div>`;
        }).join('')}</div>
      </section>
      <div class="karte-grid">
        <section class="card map-card">
          <div class="map-head">
            <div class="seg cat-seg" role="group" aria-label="Kategorie wählen"><button type="button" data-cat="alle">Alle</button>${m.kategorien.map((c) => `<button type="button" data-cat="${c.id}">${esc(c.label)}${c.ohneTest ? ' <small>(kein Test)</small>' : ''}</button>`).join('')}</div>
            <button type="button" class="btn btn-ghost btn-sm" data-act="names"></button>
          </div>
          <div class="map-slot"></div>
          <div class="pt-info" aria-live="polite"></div>
        </section>
        <div class="karte-side">
          <section class="card modes">
            <div><h2>Üben</h2><p class="small muted mode-scope"></p></div>
            <div class="switch"><span>Nur, was noch nicht sicher ist</span><button type="button" class="toggle" data-act="offen" aria-pressed="false" aria-label="Nur Unsicheres üben"></button></div>
            <div class="mode-list"></div>
          </section>
          <section class="card list-card">
            <div class="row" style="justify-content:space-between"><h2>Alle Namen</h2><button type="button" class="btn btn-ghost btn-sm" data-act="cover"></button></div>
            <div class="pt-list"></div>
          </section>
        </div>
      </div>
    </div>`);
