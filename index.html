    const a = atlas(mid, { onTap: (p) => { if (p) select(p.id); }, reach: 70 });
    el.querySelector('.map-slot').append(a.el);
    a.dots(true);
    const info = el.querySelector('.pt-info');

    const inCat = (p) => (sel.cat === 'alle' ? p.test : p.kat === sel.cat);
    function drawMap() {
      a.clear('is-cat', 'is-sel');
      m.punkte.filter(inCat).forEach((p) => a.set(p.id, 'is-cat'));
      if (sel.id) a.set(sel.id, 'is-sel');
      a.tags(S.settings.namen ? m.punkte.filter(inCat) : sel.id ? [POINTS[sel.id]] : []);
      const nb = el.querySelector('[data-act="names"]');
      nb.innerHTML = S.settings.namen ? `${icon('eyeoff')} Namen ausblenden` : `${icon('eye')} Namen einblenden`;
      nb.setAttribute('aria-pressed', String(!!S.settings.namen));
      el.querySelectorAll('.cat-seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cat === sel.cat)));
    }
    function drawInfo() {
      const p = sel.id && POINTS[sel.id];
      if (!p) {
        info.innerHTML = `<p class="muted">Tippe auf eine Nummer auf der Karte. Dann siehst du, was dort liegt. Mit „Namen einblenden“ siehst du alle auf einmal.</p>`;
        return;
      }
      const f = FALLE[p.id];
      info.innerHTML = `<div class="pi-head">${lbl(p, 'lbl-big')}<div><p class="eyebrow">${esc(m.kat[p.kat].einzahl)}</p><h3>${esc(pname(p))}</h3></div>${speakBtn(pname(p))}</div>
        <p>${esc(p.info || '')}</p>
        ${f ? `<p class="falle">${icon('warn', 20)}<span>Stolperwort: nicht „${esc(f.falsch)}“, sondern <strong>${esc(f.richtig)}</strong>.</span></p>` : ''}
        ${p.test ? `<p class="small muted">Lernstand: ${stChip(p.id)}</p>` : '<p class="small muted">Landschaften kommen im Test nicht dran.</p>'}`;
    }
    function drawModes() {
      const n = pointsOf(mid, sel.cat).filter((p) => !sel.offen || status(p.id) !== 'sicher').length;
      const catTxt = sel.cat === 'alle' ? 'alle Kategorien' : m.kat[sel.cat].label;
      el.querySelector('.mode-scope').textContent = `Auswahl: ${catTxt}${sel.offen ? ', nur Unsicheres' : ''} · ${n} ${n === 1 ? 'Ort' : 'Orte'}${n > ROUND ? ` (eine Runde hat ${ROUND} Fragen)` : ''}`;
      el.querySelector('[data-act="offen"]').setAttribute('aria-pressed', String(sel.offen));
      el.querySelector('.mode-list').innerHTML = Object.entries(MODES).map(([k, md]) => {
        const href = k === 'blatt' ? `#/karte/${mid}/blatt/${sel.cat}` : `#/karte/${mid}/${k}/${sel.cat}/${sel.offen ? 'offen' : 'alle'}`;
        const off = k !== 'blatt' && !n;
        return `<a class="mode${off ? ' is-off' : ''}" href="${href}"><span class="icon-sm">${icon(md.icon)}</span><span><span class="t">${esc(md.titel)}</span><span class="s">${esc(md.text)}</span></span>${icon('right')}</a>`;
      }).join('');
    }
    function drawList() {
      const cats = m.kategorien.filter((c) => (sel.cat === 'alle' ? !c.ohneTest : c.id === sel.cat));
      const cover = S.settings.decken;
      el.querySelector('[data-act="cover"]').innerHTML = cover ? `${icon('eye')} Aufdecken` : `${icon('eyeoff')} Abdecken`;
      el.querySelector('.pt-list').innerHTML = cats.map((c) => `<p class="pl-head"><span class="kat-dot kat-${c.id}"></span>${esc(c.label)}</p>${
        m.punkte.filter((p) => p.kat === c.id).map((p) => {
          const hide = cover && !revealed.has(p.id);
          return `<button type="button" class="pl-row${sel.id === p.id ? ' is-sel' : ''}" data-id="${p.id}">${lbl(p)}<span class="pl-name">${hide ? '<span class="cover">antippen</span>' : esc(pname(p))}</span>${p.test ? `<span class="st-dot st-${status(p.id)}" title="${STATUS_LABEL[status(p.id)]}"></span>` : ''}</button>`;
        }).join('')}`).join('');
    }
    function select(id, fromList) {
      sel.id = sel.id === id && !fromList ? null : id;
      drawMap();
      drawInfo();
      drawList();
      if (fromList && sel.id) {
        const p = POINTS[id];
        if (a.dense(p)) a.focus(p, 2.2);
        const r = el.querySelector('.map-card').getBoundingClientRect();
        if (r.top < 0 || r.top > window.innerHeight * 0.6) el.querySelector('.map-card').scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
      }
    }
    el.addEventListener('click', (e) => {
      const c = e.target.closest('[data-cat]');
      const act = e.target.closest('[data-act]');
      const row = e.target.closest('.pl-row');
      if (c) {
        sel.cat = c.dataset.cat;
        if (sel.id && !inCat(POINTS[sel.id])) sel.id = null;
        drawMap(); drawInfo(); drawModes(); drawList();
      } else if (act && act.dataset.act === 'names') {
        S.settings.namen = !S.settings.namen;
        save();
        drawMap();
      } else if (act && act.dataset.act === 'offen') {
        sel.offen = !sel.offen;
        drawModes();
      } else if (act && act.dataset.act === 'cover') {
        S.settings.decken = !S.settings.decken;
        revealed.clear();
        save();
        drawList();
      } else if (row) {
        if (S.settings.decken) revealed.add(row.dataset.id);
        select(row.dataset.id, true);
      }
    });
    drawMap(); drawInfo(); drawModes(); drawList();
    return el;
  }

  // ---------- Vollbild-Rahmen ----------
  function frame({ eyebrow, closeHash }) {
    const el = h(`<div class="runner">
      <header class="rn-head"><a class="icon-btn" href="${closeHash}" aria-label="Schließen">${icon('close')}</a>
        <div class="rn-title"><p class="eyebrow">${esc(eyebrow)}</p><div class="bar"><span></span></div></div>
        <span class="rn-count"></span></header>
      <div class="rn-body"><div class="rn-inner"></div></div>
      <footer class="rn-foot"></footer>
    </div>`);
    return {
      el,
      inner: el.querySelector('.rn-inner'),
      body: el.querySelector('.rn-body'),
      foot: el.querySelector('.rn-foot'),
      progress(done, total, label) {
        el.querySelector('.bar span').style.setProperty('--p', `${pct(done, total)}%`);
        el.querySelector('.rn-count').textContent = label === undefined ? `${Math.min(done + 1, total)}/${total}` : label;
      },
      wide(on) { el.classList.toggle('is-wide', !!on); },
    };
  }

  // ---------- Aufgabentypen ----------
  const taskPoint = (t) => (t.typ === 'karte' ? POINTS[pid(t.karte, t.kat, t.ziel)] : POINTS[t.id]);
  function solutionText(t) {
    switch (t.typ) {
      case 'mc': return t.antworten[t.richtig];
      case 'tf': return t.wahr ? 'Richtig' : 'Falsch';
      case 'luecke': return t.text.replace(/\{([^}]+)\}/g, '$1');
      case 'sortieren': return t.koerbe.map((k, i) => `${k}: ${t.karten.filter((c) => c[1] === i).map((c) => c[0]).join(', ')}`).join(' · ');
      case 'reihenfolge': return t.schritte.map((s, i) => `${i + 1}. ${s}`).join(' ');
      case 'offen': return t.punkte.join(' · ');
      case 'was': case 'wo': case 'schreib': case 'karte': { const p = taskPoint(t); return `${p.l} = ${pname(p)}`; }
      default: return '';
    }
  }
  function questionText(t) {
    if (t.frage) return t.frage;
    if (t.aussage) return t.aussage;
    const p = taskPoint(t);
    if (t.typ === 'was' || t.typ === 'schreib') return `${MAPS[p.map].titel}: Was ist ${p.l}? (${MAPS[p.map].kat[p.kat].label})`;
    if (t.typ === 'wo') return `${MAPS[p.map].titel}: Wo liegt ${pname(p)}?`;
    return t.typ === 'luecke' ? 'Lückentext' : '';
  }

  // Grundgerüst für Karten-Aufgaben: Karte links, Frage rechts (schmal: Frage oben)
  const mapTask = (side) => h(`<div class="task mq"><div class="mq-side">${side}</div><div class="mq-map"></div></div>`);

  const VIEWS = {
    mc(t, api) {
      const order = shuffle(t.antworten.map((_, i) => i));
      const el = h(`<div class="task" style="display:grid;gap:20px"><p class="q">${esc(t.frage)}</p>
        <div class="choices">${order.map((i, k) => `<button class="choice" data-i="${i}"><span class="key">${k + 1}</span><span>${esc(t.antworten[i])}</span></button>`).join('')}</div></div>`);
      const choose = (btn) => {
        if (api.locked || !btn) return;
        const ok = +btn.dataset.i === t.richtig;
        btn.classList.add(ok ? 'is-right' : 'is-wrong');
        if (!ok) el.querySelector(`[data-i="${t.richtig}"]`).classList.add('is-right');
        el.querySelectorAll('.choice').forEach((b) => { b.disabled = true; });
        api.answer(ok, t.antworten[t.richtig]);
      };
      el.addEventListener('click', (e) => choose(e.target.closest('.choice')));
      return {
        el,
        key(e) {
          const n = parseInt(e.key, 10);
          if (n >= 1 && n <= order.length) choose(el.querySelectorAll('.choice')[n - 1]);
        },
      };
    },

    tf(t, api) {
      const [lbL, lbR] = ['Falsch', 'Richtig'];
      const el = h(`<div class="task tf" style="display:grid;gap:18px"><p class="q">${esc(t.frage || 'Richtig oder falsch?')}</p>
        <div class="swipe-area"><div class="swipe-card"><div class="sc-text">${esc(t.aussage)}</div><span class="sc-tag left">${lbL}</span><span class="sc-tag right">${lbR}</span></div></div>
        <div class="two-btns"><button class="btn btn-ghost btn-big" data-v="0">${icon('left')} ${lbL}</button><button class="btn btn-ghost btn-big" data-v="1">${lbR} ${icon('right')}</button></div>
        <p class="swipe-hint">Wische die Karte nach links oder rechts.</p></div>`);
      const card = el.querySelector('.swipe-card');
      const tagL = el.querySelector('.sc-tag.left');
      const tagR = el.querySelector('.sc-tag.right');
      const decide = (v) => {
        if (api.locked) return;
        const ok = (v === 1) === t.wahr;
        card.classList.add('anim', ok ? 'is-right' : 'is-wrong');
        card.style.transform = `translateX(${v ? 40 : -40}px) rotate(${v ? 3 : -3}deg)`;
        (v ? tagR : tagL).style.opacity = 1;
        el.querySelectorAll('[data-v]').forEach((b) => { b.disabled = true; });
        api.answer(ok, t.wahr ? lbR : lbL);
      };
      swipeable(card, {
        move: (dx) => {
          if (api.locked) return;
          card.classList.remove('anim');
          card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`;
          tagL.style.opacity = Math.min(1, Math.max(0, -dx / 90));
          tagR.style.opacity = Math.min(1, Math.max(0, dx / 90));
        },
        end: (d) => {
          if (api.locked) return;
          if (d) decide(d > 0 ? 1 : 0);
          else {
            card.classList.add('anim');
            card.style.transform = '';
            tagL.style.opacity = 0;
            tagR.style.opacity = 0;
          }
        },
      });
      el.addEventListener('click', (e) => {
        const b = e.target.closest('[data-v]');
        if (b) decide(+b.dataset.v);
      });
      return {
        el,
        key(e) {
          if (e.key === 'ArrowLeft') decide(0);
          if (e.key === 'ArrowRight') decide(1);
        },
      };
    },

    sortieren(t, api) {
      const cards = shuffle(t.karten.map(([txt, b], i) => ({ txt, b, i })));
      const el = h(`<div class="task" style="display:grid;gap:16px"><p class="q">${esc(t.frage)}</p><p class="q-help">Ziehe jede Karte in den passenden Korb. Oder tippe erst die Karte und dann den Korb an.</p>
        <div class="baskets" style="--n:${t.koerbe.length}">${t.koerbe.map((k, b) => `<div class="basket" data-b="${b}" role="button" tabindex="0"><div class="b-title">${esc(k)}</div><div class="b-items"></div></div>`).join('')}</div>
        <div class="pool">${cards.map((c) => `<button class="chip" data-b="${c.b}">${esc(c.txt)}</button>`).join('')}</div></div>`);
      let sel = null, placed = 0, mistakes = 0;
      const armBaskets = (on) => el.querySelectorAll('.basket').forEach((b) => b.classList.toggle('is-armed', on));
      const place = (chip, basket) => {
        if (api.locked || chip.disabled) return;
        if (sel) { sel.classList.remove('is-sel'); sel = null; armBaskets(false); }
        if (chip.dataset.b === basket.dataset.b) {
          chip.classList.add('is-placed');
          chip.disabled = true;
          basket.querySelector('.b-items').append(chip);
          placed++;
          Sound.play('flip');
          if (placed === cards.length) {
            api.answer(mistakes === 0, null, mistakes ? { partial: true, note: `Alles einsortiert, aber mit ${mistakes} ${mistakes === 1 ? 'Fehlversuch' : 'Fehlversuchen'}.` } : {});
          }
        } else {
          mistakes++;
          Sound.play('wrong');
          basket.classList.add('is-bad');
          setTimeout(() => basket.classList.remove('is-bad'), 450);
          shake(chip);
        }
      };
      el.querySelectorAll('.chip').forEach((chip) => {
        draggable(chip, { targetSel: '.basket', onDrop: (basket) => place(chip, basket) });
        chip.addEventListener('click', () => {
          if (chip.disabled || justDragged(chip) || api.locked) return;
          if (sel === chip) { chip.classList.remove('is-sel'); sel = null; armBaskets(false); return; }
          if (sel) sel.classList.remove('is-sel');
          sel = chip;
          chip.classList.add('is-sel');
          armBaskets(true);
        });
      });
      el.querySelectorAll('.basket').forEach((basket) => {
        basket.addEventListener('click', () => { if (sel) place(sel, basket); });
      });
      return { el };
    },

    luecke(t, api) {
      const parts = t.text.split(/\{([^}]+)\}/);
      const answers = parts.filter((_, i) => i % 2 === 1);
      const words = shuffle([...answers, ...(t.extra || [])]);
      let g = 0;
      const textHtml = parts.map((p, i) => (i % 2 ? `<button class="gap" data-g="${g++}" aria-label="Lücke ${g}"></button>` : esc(p))).join('');
      const el = h(`<div class="task" style="display:grid;gap:18px"><p class="q-help">Tippe auf eine Lücke und dann auf das passende Wort. Ein Tipp auf eine gefüllte Lücke leert sie wieder.</p>
        <p class="gap-text">${textHtml}</p>
        <div class="bank">${words.map((w, i) => `<button class="chip" data-w="${i}">${esc(w)}</button>`).join('')}</div></div>`);
      const gaps = [...el.querySelectorAll('.gap')];
      const chips = [...el.querySelectorAll('.bank .chip')];
      const fill = answers.map(() => null);
      let activeGap = 0;
      const update = () => {
        gaps.forEach((gp, i) => {
          gp.textContent = fill[i] === null ? '' : words[fill[i]];
          gp.classList.toggle('is-filled', fill[i] !== null);
          gp.classList.toggle('is-active', i === activeGap && !api.locked);
        });
        api.ready(fill.every((x) => x !== null));
      };
      el.addEventListener('click', (e) => {
        if (api.locked) return;
        const gp = e.target.closest('.gap');
        const ch = e.target.closest('.bank .chip');
        if (gp) {
          const i = +gp.dataset.g;
          if (fill[i] !== null) { chips[fill[i]].classList.remove('is-used'); fill[i] = null; }
          activeGap = i;
          update();
        } else if (ch && !ch.classList.contains('is-used')) {
          if (activeGap === -1) activeGap = fill.findIndex((x) => x === null);
          if (activeGap === -1) return;
          if (fill[activeGap] !== null) chips[fill[activeGap]].classList.remove('is-used');
          fill[activeGap] = +ch.dataset.w;
          ch.classList.add('is-used');
          Sound.play('flip');
          activeGap = fill.findIndex((x) => x === null);
          update();
        }
      });
      api.check(() => {
        const res = fill.map((w, i) => words[w] === answers[i]);
        gaps.forEach((gp, i) => gp.classList.add(res[i] ? 'is-right' : 'is-wrong'));
        const ok = res.every(Boolean);
        api.answer(ok, solutionText(t), ok ? {} : { note: `${res.filter((x) => !x).length} von ${res.length} Lücken waren falsch gefüllt.` });
        update();
      }, false);
      update();
      return { el };
    },

    // Schritte der Reihe nach antippen, den ersten zuerst
    reihenfolge(t, api) {
      const items = t.schritte.map((text, i) => ({ i, text }));
      const el = h(`<div class="task" style="display:grid;gap:16px"><p class="q">${esc(t.frage)}</p>
        <p class="q-help">Tippe die Schritte nacheinander an, den ersten zuerst.</p>
        <div class="tl-wrap">
          <div class="tl-pool">${shuffle(items).map((x) => `<button class="chip tl-chip" data-i="${x.i}">${esc(x.text)}</button>`).join('')}</div>
          <ol class="tl" aria-label="Reihenfolge">${items.map((_, k) => `<li class="tl-slot" data-k="${k}"><span class="tl-yr">${k + 1}.</span><span class="tl-txt"></span></li>`).join('')}</ol>
        </div></div>`);
      let k = 0, mistakes = 0;
      el.addEventListener('click', (e) => {
        const b = e.target.closest('.tl-chip');
        if (!b || b.disabled || api.locked) return;
        if (+b.dataset.i === k) {
          const slot = el.querySelector(`.tl-slot[data-k="${k}"]`);
          slot.classList.add('is-filled');
          slot.querySelector('.tl-txt').textContent = items[k].text;
          b.classList.add('is-used');
          b.disabled = true;
          k++;
          Sound.play('flip');
          if (k === items.length) {
            api.answer(mistakes === 0, null, mistakes ? { partial: true, note: `Richtig geordnet, aber mit ${mistakes} ${mistakes === 1 ? 'Fehlversuch' : 'Fehlversuchen'}.` } : {});
          }
        } else {
          mistakes++;
          Sound.play('wrong');
          b.classList.add('is-bad');
          shake(b);
          setTimeout(() => b.classList.remove('is-bad'), 450);
        }
      });
      return { el };
    },

    // Karte: Nummer ist markiert, Namen auswählen
    was(t, api) {
      const p = taskPoint(t);
      const m = MAPS[p.map];
      const others = shuffle(m.punkte.filter((q) => q.kat === p.kat && q !== p)).slice(0, 3);
      const opts = shuffle([p, ...others]);
      const el = mapTask(`<p class="eyebrow">${esc(m.titel)} · ${esc(m.kat[p.kat].label)}</p><p class="q">Was ist ${lbl(p, 'lbl-q')}?</p><div class="mq-lupe"></div>
        <div class="choices one">${opts.map((q, i) => `<button class="choice" data-id="${q.id}"><span class="key">${i + 1}</span><span>${esc(pname(q))}</span></button>`).join('')}</div>`);
      const a = atlas(p.map);
      a.set(p.id, 'is-ask');
      el.querySelector('.mq-map').append(a.el);
      const lp = lupe(p);
      el.querySelector('.mq-lupe').append(lp);
      const choose = (btn) => {
        if (api.locked || !btn) return;
        const q = POINTS[btn.dataset.id];
        const ok = q === p;
        btn.classList.add(ok ? 'is-right' : 'is-wrong');
        if (!ok) el.querySelector(`.choice[data-id="${p.id}"]`).classList.add('is-right');
        el.querySelectorAll('.choice').forEach((b) => { b.disabled = true; });
        a.set(p.id, 'is-ask', false);
        a.set(p.id, ok ? 'is-right' : 'is-target');
        if (!ok) a.set(q.id, 'is-wrong');
        a.tags(ok ? [p] : [p, q]);
        lp.reveal(ok ? 'is-right' : 'is-target');
        api.answer(ok, `${p.l} = ${pname(p)}`, ok ? {} : { note: `${pname(q)} ist ${q.l} auf der Karte.` });
      };
      el.addEventListener('click', (e) => choose(e.target.closest('.choice')));
      return {
        el,
        key(e) {
          const n = parseInt(e.key, 10);
          if (n >= 1 && n <= opts.length) choose(el.querySelectorAll('.choice')[n - 1]);
        },
      };
    },

    // Karte: Name ist vorgegeben, Nummer antippen
    wo(t, api) {
      const p = taskPoint(t);
      const m = MAPS[p.map];
      const kat = m.kat[p.kat];
      const cands = m.punkte.filter((q) => q.kat === p.kat);
      const el = mapTask(`<p class="eyebrow">${esc(m.titel)} · ${esc(kat.label)}</p>
        <p class="q">${t.frage ? esc(t.frage) : `Wo liegt <span class="hl">${esc(pname(p))}</span>?`}</p>
        <p class="q-help">Tippe auf der Karte auf die passende Nummer (${esc(kat.label)} ${esc(kat.zeichen)}). Zum Vergrößern: zwei Finger oder die Knöpfe auf der Karte.</p>`);
      const a = atlas(p.map, {
        candidates: () => cands,
        reach: 160,
        onTap(q) {
          if (api.locked) return;
          if (!q) { toast('Tippe näher an eine Nummer.'); return; }
          const ok = q === p;
          a.set(q.id, ok ? 'is-right' : 'is-wrong');
          if (!ok) {
            a.set(p.id, 'is-target');
            if (a.dense(p)) a.focus(p, 2.2);
          }
          a.tags(ok ? [p] : [p, q]);
          api.answer(ok, `${pname(p)} ist ${p.l}`, ok ? {} : { note: `Du hast ${q.l} angetippt, das ist ${pname(q)}.` });
        },
      });
      el.querySelector('.mq-map').append(a.el);
      return { el };
    },
    karte(t, api) { return VIEWS.wo(t, api); },

    // Karte: Namen selbst schreiben
    schreib(t, api) {
      const p = taskPoint(t);
      const m = MAPS[p.map];
      const f = FALLE[p.id];
      const el = mapTask(`<p class="eyebrow">${esc(m.titel)} · ${esc(m.kat[p.kat].label)}</p><p class="q">Wie heißt ${lbl(p, 'lbl-q')}?</p>
        ${t.falle && f ? `<p class="falle">${icon('warn', 20)}<span>Stolperwort! Auf dem Arbeitsblatt stand hier: „${esc(f.falsch)}“.</span></p>` : ''}
        <div class="mq-lupe"></div>
        <div class="field"><label for="answer-in">Deine Antwort</label><input id="answer-in" class="input input-big" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="done" placeholder="Name eintippen"></div>
        <p class="answer-res" aria-live="polite"></p>`);
      const a = atlas(p.map);
      a.set(p.id, 'is-ask');
      el.querySelector('.mq-map').append(a.el);
      const lp = lupe(p);
      el.querySelector('.mq-lupe').append(lp);
      const input = el.querySelector('#answer-in');
      input.addEventListener('input', () => api.ready(input.value.trim().length > 0));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); if (input.value.trim()) check(); }
      });
      function check() {
        if (api.locked) return;
        const r = checkName(input.value, p);
        input.disabled = true;
        input.classList.add(r.res === 'ok' ? 'is-right' : r.res === 'fast' ? 'is-fast' : 'is-wrong');
        a.set(p.id, 'is-ask', false);
        a.set(p.id, r.res === 'ok' ? 'is-right' : 'is-target');
        a.tags([p]);
        lp.reveal(r.res === 'ok' ? 'is-right' : 'is-target');
        try { input.blur(); } catch (e) { /* ignorieren */ }
        const sol = pname(p);
        if (r.res === 'ok') api.answer('ok', sol, r.hint ? { note: r.hint } : {});
        else if (r.res === 'fast') api.answer('fast', sol, { note: `Du hast „${input.value.trim()}“ geschrieben. Achte genau auf die Schreibweise.` });
        else api.answer('bad', sol, { note: r.other ? `${pname(r.other)} ist ${r.other.l} auf der Karte.` : `Du hast „${input.value.trim()}“ geschrieben.` });
      }
      api.check(check, false);
      return { el, mount() { try { input.focus({ preventScroll: true }); } catch (e) { /* ignorieren */ } } };
    },

    // Offene Frage: erst selbst erklären, dann mit der Musterlösung abhaken
    offen(t, api) {
      const el = h(`<div class="task" style="display:grid;gap:16px"><p class="q">${esc(t.frage)}</p>
        <div class="field"><label for="offen-in">Deine Antwort in Stichpunkten (oder laut sagen)</label><textarea id="offen-in" class="input" rows="5" placeholder="Stichpunkte …"></textarea></div>
        <div class="checklist" hidden><p class="q-help">Vergleiche mit der Musterlösung. Tippe an, was in deiner Antwort vorkam.</p><div class="ck-list">${t.punkte.map((pt, i) => `<button type="button" class="ck" data-i="${i}" aria-pressed="false"><span class="ck-box">${icon('check', 18)}</span><span>${esc(pt)}</span></button>`).join('')}</div></div></div>`);
      const list = el.querySelector('.checklist');
      const need = Math.ceil(t.punkte.length * 0.75);
      api.check(() => {
        list.hidden = false;
        el.querySelector('textarea').readOnly = true;
        list.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'nearest' });
        api.check(() => {
          const n = el.querySelectorAll('.ck[aria-pressed="true"]').length;
          el.querySelectorAll('.ck').forEach((b) => { b.disabled = true; });
          api.answer(n >= need ? 'ok' : 'bad', null, { note: `${n} von ${t.punkte.length} Punkten gewusst. Ab ${need} Punkten zählt die Antwort als richtig.` });
        }, true, 'Auswerten');
      }, true, 'Lösung zeigen');
      el.addEventListener('click', (e) => {
        const b = e.target.closest('.ck');
        if (!b || b.disabled) return;
        b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
        Sound.play('flip');
      });
      return { el };
    },
  };

  // ---------- Gesten ----------
  function swipeable(node, { move, end, threshold = 90 }) {
    let sx = 0, sy = 0, id = null, act = false, horiz = null, t0 = 0;
    node.addEventListener('pointerdown', (e) => {
      if (e.button > 0 || e.target.closest('button, a')) return;
      id = e.pointerId; sx = e.clientX; sy = e.clientY; act = true; horiz = null; t0 = performance.now();
    });
    node.addEventListener('pointermove', (e) => {
      if (!act || e.pointerId !== id) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (horiz === null && Math.hypot(dx, dy) > 8) {
        horiz = Math.abs(dx) > Math.abs(dy);
        if (horiz) try { node.setPointerCapture(id); } catch (err) { /* ignorieren */ }
      }
      if (horiz) move && move(dx);
    });
    node.addEventListener('pointerup', (e) => {
      if (!act || e.pointerId !== id) return;
      act = false;
      if (!horiz) return;
      node._swiped = Date.now();
      const dx = e.clientX - sx;
      const v = Math.abs(dx) / Math.max(1, performance.now() - t0);
      end && end(Math.abs(dx) > threshold || (v > 0.6 && Math.abs(dx) > 30) ? Math.sign(dx) : 0);
    });
    node.addEventListener('pointercancel', () => {
      if (!act) return;
      act = false;
      if (horiz) end && end(0);
    });
  }
  const justSwiped = (node) => node._swiped && Date.now() - node._swiped < 400;
  function draggable(node, { targetSel, onDrop }) {
    let start = null, id = null, ghost = null, over = null, dragging = false;
    node.addEventListener('pointerdown', (e) => {
      if (node.disabled || e.button > 0) return;
      start = { x: e.clientX, y: e.clientY };
      id = e.pointerId;
      try { node.setPointerCapture(id); } catch (err) { /* ignorieren */ }
    });
    node.addEventListener('pointermove', (e) => {
      if (!start || e.pointerId !== id) return;
      const dx = e.clientX - start.x, dy = e.clientY - start.y;
      if (!dragging && Math.hypot(dx, dy) > 8) {
        dragging = true;
        const r = node.getBoundingClientRect();
        ghost = node.cloneNode(true);
        ghost.classList.add('drag-ghost');
        ghost.classList.remove('is-sel');
        Object.assign(ghost.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px` });
        document.body.append(ghost);
        node.classList.add('is-dragging');
      }
      if (!dragging) return;
      ghost.style.transform = `translate(${dx}px, ${dy}px) rotate(2deg)`;
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const target = hit ? hit.closest(targetSel) : null;
      if (target !== over) {
        if (over) over.classList.remove('is-over');
        over = target;
        if (over) over.classList.add('is-over');
      }
    });
    const finish = (e, cancelled) => {
      if (!start || (e && e.pointerId !== id)) return;
      if (dragging) {
        node._dragged = Date.now();
        ghost.remove();
        node.classList.remove('is-dragging');
        if (over) over.classList.remove('is-over');
        if (!cancelled && over) onDrop(over);
      }
      start = null; dragging = false; over = null; ghost = null;
    };
    node.addEventListener('pointerup', (e) => finish(e, false));
    node.addEventListener('pointercancel', (e) => finish(e, true));
  }
  const justDragged = (node) => node._dragged && Date.now() - node._dragged < 400;
  function shake(node) {
    node.classList.remove('shake');
    void node.offsetWidth;
    node.classList.add('shake');
  }

  // ---------- Aufgaben-Ablauf ----------
  const PART_NR = { na: 1, sa: 2, hu: 3, to: 4 };
  function taskRunner(tasks, opts) {
    const mode = opts.mode || 'practice'; // practice | review | probe
    const f = frame({ eyebrow: opts.title, closeHash: opts.closeHash });
    const requeue = mode !== 'probe' && !opts.noRequeue;
    const hints = mode !== 'probe';
    const queue = tasks.map((t) => ({ t, retry: false }));
    const total = tasks.length;
    const missed = [];
    const results = []; // erste Versuche: { t, res }
    let firstDone = 0, firstRight = 0, locked = false, hintUsed = false, sheetOpen = false;
    let cur = null;
    const sheet = h('<div class="sheet" role="status" aria-live="polite"></div>');
    f.el.append(sheet);

    const api = {
      answer: (res, sol, extra) => answer(res === true ? 'ok' : res === false ? 'bad' : res, sol, extra || {}),
      check(fn, ready = true, label = 'Prüfen') { cur.check = fn; cur.ready = ready; cur.label = label; renderFoot(); },
      ready(b) {
        cur.ready = b;
        const btn = f.foot.querySelector('[data-act="check"]');
        if (btn) btn.disabled = !b;
      },
      get locked() { return locked; },
    };

    function renderFoot() {
      if (!cur || sheetOpen) return;
      const t = cur.item.t;
      const tip = hints && t.tipp && !locked && !hintUsed;
      const check = cur.check && !locked;
      f.foot.innerHTML = tip || check
        ? `${tip ? `<button class="btn btn-ghost" data-act="tip">${icon('bulb')} Tipp</button>` : ''}<span class="spacer"></span>${
          check ? `<button class="btn btn-primary btn-big" data-act="check" ${cur.ready ? '' : 'disabled'}>${esc(cur.label || 'Prüfen')}</button>` : ''}`
        : '';
    }
    f.foot.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (!a || !cur) return;
      if (a.dataset.act === 'tip') {
        hintUsed = true;
        const side = f.inner.querySelector('.mq-side') || f.inner.querySelector('.task');
        side.insertAdjacentHTML('beforeend', `<div class="merke"><span class="eyebrow">Tipp</span>${esc(cur.item.t.tipp)}</div>`);
        renderFoot();
      } else if (a.dataset.act === 'check' && cur.ready && cur.check) cur.check();
    });

    function next() {
      sheet.classList.remove('show');
      f.el.classList.remove('has-sheet');
      sheetOpen = false;
      if (!queue.length) { finish(); return; }
      const item = queue.shift();
      locked = false;
      hintUsed = false;
      cur = { item, check: null, ready: false, label: 'Prüfen' };
      const view = VIEWS[item.t.typ](item.t, api);
      cur.view = view;
      f.wide(MAP_TYPES.has(item.t.typ));
      f.inner.replaceChildren();
      const badges = [];
      if (mode === 'probe' && item.t.teil) badges.push(`<span class="badge-part">Teil ${PART_NR[item.t.teil]} · ${esc(AREA[item.t.teil].titel)}</span>`);
      if (item.retry) badges.push('<span class="badge-retry">Noch einmal</span>');
      if (badges.length) f.inner.append(h(`<div class="badges">${badges.join('')}</div>`));
      f.inner.append(view.el);
      f.body.scrollTop = 0;
      f.progress(firstDone, total, item.retry ? 'Wdh.' : undefined);
      renderFoot();
      if (view.mount) view.mount();
    }

    function answer(res, sol, extra) {
      if (locked) return;
      locked = true;
      const { item } = cur;
      const t = item.t;
      const ok = res === 'ok';
      Sound.play(ok ? 'right' : res === 'fast' ? 'fast' : 'wrong');
      if (!item.retry) {
        firstDone++;
        results.push({ t, res });
        if (ok) firstRight++;
        else missed.push(t);
      }
      mark(t.key, res, t.typ, item.retry);
      const willRetry = !ok && requeue && !item.retry;
      if (willRetry) queue.push({ t, retry: true });
      save();
      f.progress(firstDone, total, `${Math.min(firstDone, total)}/${total}`);
      showSheet(res, t, sol, extra, willRetry);
    }

    function showSheet(res, t, sol, extra, willRetry) {
      sheetOpen = true;
      f.foot.innerHTML = '';
      const ok = res === 'ok';
      const cheer = ok ? pick(['Super!', 'Stark!', 'Genau!', 'Klasse!', 'Sitzt!']) : res === 'fast' ? 'Fast geschafft' : pick(['Weiter so!', 'Gleich klappt’s!', 'Dranbleiben!']);
      const title = ok ? 'Richtig!' : res === 'fast' ? 'Fast richtig' : extra.partial ? 'Fast!' : 'Nicht ganz';
      sheet.className = `sheet${ok ? '' : res === 'fast' ? ' is-fast' : ' is-bad'}`;
      sheet.innerHTML = `<div class="sheet-inner"><div class="mark">${icon(ok ? 'check' : res === 'fast' ? 'pencil' : 'close', 30)}</div>
        <p class="eyebrow">${cheer}</p><h3>${title}</h3>
        <div style="display:grid;gap:4px">${!ok && sol ? `<p class="sol">${res === 'fast' ? 'Richtig geschrieben' : 'Richtig ist'}: ${esc(sol)}</p>` : ''}${extra.note ? `<p class="why">${esc(extra.note)}</p>` : ''}${t.erklaerung ? `<p class="why">${esc(t.erklaerung)}</p>` : ''}${willRetry ? '<p class="why small">Diese Aufgabe kommt am Ende der Runde noch einmal.</p>' : ''}</div>
        <div class="act"><button class="btn btn-primary btn-big" data-act="next">Weiter ${icon('right')}</button></div></div>`;
      f.el.classList.add('has-sheet');
      requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add('show')));
      const btn = sheet.querySelector('[data-act="next"]');
      btn.addEventListener('click', next);
      setTimeout(() => { try { btn.focus({ preventScroll: true }); } catch (e) { /* ignorieren */ } }, 320);
    }

    function mistakesHtml() {
      if (!missed.length) return '';
      return `<div class="mistakes"><p class="eyebrow">Das hat noch nicht geklappt</p><ul>${missed
        .map((t) => `<li><strong>${esc(questionText(t))}</strong><span>Lösung: ${esc(solutionText(t))}</span>${t.erklaerung ? `<span class="muted small">${esc(t.erklaerung)}</span>` : ''}</li>`)
        .join('')}</ul></div>`;
    }

    function finish() {
      cur = null;
      f.foot.innerHTML = '';
      f.wide(false);
      f.progress(total, total, `${total}/${total}`);
      let html;
      if (!total) {
        html = `<div class="result"><h2>${esc(opts.emptyTitle || 'Nichts zu üben')}</h2><p class="muted" style="max-width:52ch">${esc(opts.emptyText || 'Gerade ist hier nichts offen. Stark!')}</p>
          <div class="acts"><a class="btn btn-primary btn-big" href="${opts.closeHash}">${esc(opts.backLabel || 'Zurück')}</a></div></div>`;
      } else if (mode === 'probe') {
        const rate = firstRight / total;
        const P = S.probe || (S.probe = { best: 0, last: null });
        P.best = Math.max(P.best || 0, rate);
        P.last = { date: todayIso(), right: firstRight, total };
        save();
        const per = new Map();
        for (const { t, res } of results) {
          const e = per.get(t.teil) || { r: 0, n: 0 };
          e.n++;
          if (res === 'ok') e.r++;
          per.set(t.teil, e);
        }
        const weak = (e) => e.r / e.n < 0.8;
        const rows = [...per.entries()].map(([id, e]) => `<div class="fs-row${weak(e) ? ' is-weak' : ''}"><span class="fs-nr">${PART_NR[id]}</span><div><div class="fs-top"><strong>${esc(AREA[id].titel)}</strong><span class="fs-num">${e.r}/${e.n}</span></div><div class="bar"><span style="--p:${pct(e.r, e.n)}%"></span></div></div>${
          weak(e) ? `<a class="btn btn-ghost" href="${AREA[id].hash}">Üben</a>` : `<span class="fs-ok" aria-label="sitzt">${icon('check', 24)}</span>`}</div>`).join('');
        const msg = rate >= 0.9 ? 'Hervorragend! So kann der Test kommen.'
          : rate >= 0.75 ? 'Gut! Schau dir die Fehler unten an, dann sitzt auch der Rest.'
          : rate >= 0.5 ? 'Ein guter Anfang. Übe die markierten Teile und mach die Generalprobe dann noch einmal.'
          : 'Da geht noch mehr. Lerne zuerst die markierten Teile und versuch es dann noch einmal.';
        html = `<div class="result"><p class="eyebrow">Generalprobe</p><h2>${rate >= 0.9 ? 'Prüfungsfit!' : 'Generalprobe geschafft'}</h2>
          <div class="score">${pct(firstRight, total)} %</div><p class="muted">${firstRight} von ${total} beim ersten Versuch richtig</p>
          <p style="max-width:52ch">${msg}</p>
          <div class="acts"><a class="btn btn-primary btn-big" href="#/pruefung">${icon('redo')} Neue Generalprobe</a>${missed.length ? '<a class="btn btn-ghost btn-big" href="#/pruefung/fehler">Fehler wiederholen</a>' : ''}</div>
          <div class="final-stations"><p class="eyebrow">Auswertung nach Teilen</p>${rows}</div>
          ${mistakesHtml()}</div>`;
        if (rate >= 0.9) setTimeout(() => Sound.play('done'), 250);
      } else {
        const all = firstRight === total;
        html = `<div class="result"><p class="eyebrow">${esc(opts.title)}</p><h2>${all ? 'Alles richtig!' : 'Runde geschafft!'}</h2><div class="score">${firstRight}/${total}</div>
          <p class="muted" style="max-width:52ch">beim ersten Versuch richtig${opts.resultNote ? ` · ${esc(opts.resultNote)}` : ''}</p>
          <div class="acts"><button class="btn btn-primary btn-big" data-act="again">${icon('redo')} Neue Runde</button><a class="btn btn-ghost btn-big" href="${opts.closeHash}">${esc(opts.backLabel || 'Zurück')}</a></div>
          ${mistakesHtml()}</div>`;
        if (all) setTimeout(() => Sound.play('done'), 250);
      }
      f.inner.innerHTML = html;
      f.body.scrollTop = 0;
      const again = f.inner.querySelector('[data-act="again"]');
      if (again) again.addEventListener('click', () => render());
    }

    next();
    return {
      el: f.el,
      key(e) {
        if (sheetOpen) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); }
          return;
        }
        if (!cur) return;
        if (e.key === 'Enter' && cur.check && cur.ready && !locked) { e.preventDefault(); cur.check(); return; }
        if (cur.view && cur.view.key && !locked) cur.view.key(e);
      },
    };
  }

  // ---------- Kartenrunden ----------
  // Fehler zuerst, dann Wackeliges, dann Neues, zuletzt Sicheres
  function prioritize(pts, n) {
    const rank = (p) => (S.wrong[p.id] ? 0 : { wackelig: 1, neu: 2, sicher: 3 }[status(p.id)]);
    return shuffle(shuffle(pts).sort((a, b) => rank(a) - rank(b)).slice(0, n));
  }
  function runMapQuiz(mid, mode, cat, filter) {
    const m = MAPS[mid];
    let pts = pointsOf(mid, cat);
    if (filter === 'offen') pts = pts.filter((p) => status(p.id) !== 'sicher');
    const tasks = prioritize(pts, ROUND).map((p) => ({ typ: mode, id: p.id, key: p.id, teil: mid }));
    const catTxt = cat === 'alle' ? '' : ` · ${m.kat[cat].label}`;
    return taskRunner(tasks, {
      title: `${m.titel} · ${MODES[mode].titel}${catTxt}`,
      closeHash: `#/karte/${mid}`,
      backLabel: `Zurück zu ${m.titel}`,
      emptyTitle: 'Hier ist alles sicher',
      emptyText: 'In dieser Auswahl ist nichts mehr unsicher. Wähle „Alle“ oder eine andere Kategorie.',
      resultNote: mode === 'schreib' ? 'Zweimal hintereinander richtig, dann ist ein Ort sicher' : 'Für „sicher“ musst du die Namen auch einmal selbst schreiben',
    });
  }

  // Arbeitsblatt: stumme Karte komplett beschriften wie im Test
  function runBlatt(mid, cat) {
    const m = MAPS[mid];
    const pts = pointsOf(mid, cat);
    const f = frame({ eyebrow: `${m.titel} · Arbeitsblatt${cat === 'alle' ? '' : ` · ${m.kat[cat].label}`}`, closeHash: `#/karte/${mid}` });
    f.wide(true);
    const groups = m.kategorien.filter((k) => pts.some((p) => p.kat === k.id));
    f.inner.innerHTML = `<div class="blatt"><div class="blatt-map"></div><div class="blatt-form">
      <div class="blatt-sum" hidden></div>
      <p class="q-help">Schreib zu jeder Nummer den Namen. Tippst du in ein Feld, wird die Nummer auf der Karte markiert. Leere Felder zählen als falsch.</p>
      ${groups.map((k) => `<fieldset class="b-group"><legend><span class="kat-dot kat-${k.id}"></span>${esc(k.label)}</legend>${pts.filter((p) => p.kat === k.id).map((p) => `<div class="b-row" data-id="${p.id}"><label class="lbl kat-${p.kat}" for="b-${domId(p.id)}">${esc(p.l)}</label><input class="input b-in" id="b-${domId(p.id)}" data-id="${p.id}" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="next"><span class="b-res"></span></div>`).join('')}</fieldset>`).join('')}
    </div></div>`;
    const a = atlas(mid);
    f.inner.querySelector('.blatt-map').append(a.el);
    const inputs = [...f.inner.querySelectorAll('.b-in')];
    let done = false;
    const count = () => {
      const n = inputs.filter((i) => i.value.trim()).length;
      f.progress(n, inputs.length, `${n}/${inputs.length}`);
    };
    f.inner.addEventListener('focusin', (e) => {
      const i = e.target.closest('.b-in');
      if (!i || done) return;
      a.clear('is-ask');
      a.set(i.dataset.id, 'is-ask');
    });
    f.inner.addEventListener('input', count);
    f.inner.addEventListener('keydown', (e) => {
      const i = e.target.closest('.b-in');
      if (!i || e.key !== 'Enter') return;
      e.preventDefault();
      const nx = inputs[inputs.indexOf(i) + 1];
      if (nx) nx.focus(); else i.blur();
    });
    function evaluate() {
      done = true;
      a.clear('is-ask');
      let right = 0, fast = 0;
      for (const i of inputs) {
        const p = POINTS[i.dataset.id];
        const r = checkName(i.value, p);
        mark(p.id, r.res, 'schreib');
        i.disabled = true;
        const row = i.closest('.b-row');
        row.classList.add(r.res === 'ok' ? 'is-ok' : r.res === 'fast' ? 'is-fast' : 'is-bad');
        if (r.res === 'ok') right++;
        if (r.res === 'fast') fast++;
        a.set(p.id, r.res === 'ok' ? 'is-right' : r.res === 'fast' ? 'is-fastring' : 'is-wrong');
        row.querySelector('.b-res').innerHTML = r.res === 'ok' && !r.hint
          ? icon('check', 22)
          : `<span class="b-sol">${r.res === 'ok' ? 'Genau: ' : ''}${esc(pname(p))}</span>`;
      }
      a.tags(inputs.filter((i) => !i.closest('.b-row').classList.contains('is-ok')).map((i) => POINTS[i.dataset.id]));
      save();
      const rate = right / inputs.length;
      const sum = f.inner.querySelector('.blatt-sum');
      sum.hidden = false;
      sum.innerHTML = `<div class="score">${right}/${inputs.length}</div><p><strong>${pct(right, inputs.length)} % richtig.</strong> ${fast ? `${fast} ${fast === 1 ? 'Name war' : 'Namen waren'} fast richtig geschrieben. ` : ''}${rate >= 0.9 ? 'Super, das Blatt sitzt!' : 'Die roten Felder zeigen dir die richtigen Namen.'}</p>`;
      Sound.play(rate >= 0.9 ? 'done' : rate >= 0.5 ? 'right' : 'wrong');
      f.foot.innerHTML = `<a class="btn btn-ghost btn-big" href="#/karte/${mid}">Zur Karte</a><span class="spacer"></span><button class="btn btn-primary btn-big" data-act="again">${icon('redo')} Leeres Blatt</button>`;
      f.body.scrollTop = 0;
    }
    f.foot.innerHTML = `<span class="spacer"></span><button class="btn btn-primary btn-big" data-act="eval">Auswerten</button>`;
    f.foot.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'eval') evaluate();
      if (b.dataset.act === 'again') render();
    });
    count();
    return { el: f.el };
  }

  // ---------- Wetterextreme ----------
  function topicSteps(tp) {
    const n = (list) => list.filter((x) => status(x.key) === 'sicher').length;
    return [
      { id: 'lernen', titel: 'Lernen', sub: `${tp.karten.length} Infokarten aus deinem Heft`, icon: 'read', done: !!S.read[tp.id], info: S.read[tp.id] ? 'gelesen' : 'offen' },
      { id: 'karten', titel: 'Karteikarten', sub: `${tp.fragen.length} Fragen zum Umdrehen`, icon: 'cards', done: n(tp.fragen) === tp.fragen.length, info: `${n(tp.fragen)}/${tp.fragen.length} sicher` },
      { id: 'ueben', titel: 'Üben', sub: `${tp.ueben.length} Aufgaben wie im Test`, icon: 'quiz', done: n(tp.ueben) === tp.ueben.length, info: `${n(tp.ueben)}/${tp.ueben.length} sicher` },
      { id: 'erklaeren', titel: 'Erklären', sub: `${tp.erklaeren.length} ${tp.erklaeren.length === 1 ? 'Frage' : 'Fragen'} mit Musterlösung`, icon: 'talk', done: n(tp.erklaeren) === tp.erklaeren.length, info: `${n(tp.erklaeren)}/${tp.erklaeren.length} sicher` },
    ];
  }
  const VERGLEICH = [
    ['Was ist das?', 'tropischer Wirbelsturm', 'mächtiger Luftwirbel mit Kontakt zum Boden'],
    ['Wo entsteht er?', 'über dem warmen Meer, wo die Passatwinde wehen (5° bis 20° Breite)', 'über Land, vor allem in den Great Plains („Allee der Tornados“)'],
    ['Was braucht er?', 'Meerwasser mit mindestens 26,5 °C (Juni bis November)', 'feucht-warme Luft aus dem Süden trifft auf trocken-kalte Luft aus dem Norden'],
    ['Wie schnell?', 'ab 118 km/h, Irma bis zu 300 km/h', 'bis zu 510 km/h'],
    ['Wie lange?', 'verliert an Land schnell an Kraft', 'wenige Sekunden bis zu einer Stunde'],
    ['Folgen', 'Stürme, starke Regenfälle, Städte wie Miami unter Wasser', 'Sturm, Hagel, Starkregen; reißt alles mit'],
  ];
  const vergleichTable = () => `<div class="table-wrap"><table class="vgl"><thead><tr><th></th><th>Hurrikan</th><th>Tornado</th></tr></thead><tbody>${VERGLEICH.map(([a, b, c]) => `<tr><th scope="row">${esc(a)}</th><td>${esc(b)}</td><td>${esc(c)}</td></tr>`).join('')}</tbody></table></div>`;

  function viewWetter() {
    const el = h(`<div class="page">
      <header class="topbar"><div><p class="eyebrow">Wetterextreme in Nordamerika</p><h1>Hurrikans und Tornados</h1></div>${gearBtn()}</header>
      <div class="wetter-grid">${TOPICS.map((tp) => {
        const st = areaStats(tp.id);
        const steps = topicSteps(tp);
        const nextId = (steps.find((s) => !s.done) || steps[2]).id;
        return `<section class="card topic">
          <div class="topic-head"><img src="${IMG[tp.bild]}" alt="" width="96" height="96"><div><p class="eyebrow">${esc(tp.untertitel)}</p><h2>${esc(tp.titel)}</h2><p class="small muted">${st.pct} % sicher · ${st.sicher} von ${st.total}</p><div class="bar"><span style="--p:${st.pct}%"></span></div></div></div>
          <div class="steps">${steps.map((s, i) => `<a class="step${s.done ? ' is-done' : ''}${s.id === nextId && !s.done ? ' is-next' : ''}" href="#/thema/${tp.id}/${s.id}"><span class="num">${s.done ? icon('check', 22) : i + 1}</span><span><span class="t">${esc(s.titel)}</span><span class="s">${esc(s.sub)}</span></span><span class="status">${esc(s.info)}</span></a>`).join('')}</div>
        </section>`;
      }).join('')}</div>
      <section class="card"><h2 class="h2-sm">Hurrikan oder Tornado?</h2><p class="small muted" style="margin:4px 0 12px">Der Vergleich ist eine typische Testfrage.</p>${vergleichTable()}</section>
    </div>`);
    return el;
  }

  function runThema(tp, step) {
    const closeHash = '#/wetter';
    if (step === 'lernen') return infoPager(tp);
    if (step === 'karten') return flashDeck(tp);
    if (step === 'erklaeren') {
      return taskRunner(tp.erklaeren.slice(), { title: `${tp.titel} · Erklären`, closeHash, backLabel: 'Zurück zu den Wetterextremen', noRequeue: true });
    }
    return taskRunner(shuffle(tp.ueben), { title: `${tp.titel} · Üben`, closeHash, backLabel: 'Zurück zu den Wetterextremen' });
  }

  function infoPager(tp) {
    const f = frame({ eyebrow: `${tp.titel} · Lernen`, closeHash: '#/wetter' });
    const n = tp.karten.length;
    const nSteps = tp.karten.filter((k) => k.schritt).length;
    let i = 0;
    function show(dir) {
      const k = tp.karten[i];
      if (i === n - 1 && !S.read[tp.id]) { S.read[tp.id] = true; save(); }
      f.inner.innerHTML = `<article class="info ${dir > 0 ? 'slide-in-r' : dir < 0 ? 'slide-in-l' : ''}">
          <div class="row" style="justify-content:space-between"><span class="eyebrow">Karte ${i + 1} von ${n}</span>${speakBtn(`${k.titel}. ${k.text}`, 'Vorlesen')}</div>
          ${k.schritt ? `<ol class="chain" aria-label="Entstehung in ${nSteps} Schritten">${Array.from({ length: nSteps }, (_, j) => `<li class="${j + 1 === k.schritt ? 'on' : j + 1 < k.schritt ? 'past' : ''}">${j + 1}</li>`).join('')}</ol>` : ''}
          <h2>${esc(k.titel)}</h2><p class="txt">${esc(k.text)}</p>
          <div class="merke"><span class="eyebrow">Merke</span>${esc(k.merke)}</div>
          ${i === 0 ? `<img class="info-img" src="${IMG[tp.bild]}" alt="" width="180" height="180">` : ''}
        </article>
        <div class="dots" aria-hidden="true">${tp.karten.map((_, j) => `<i class="${j === i ? 'on' : j < i ? 'seen' : ''}"></i>`).join('')}</div>
        <p class="swipe-hint">Wische nach links für die nächste Karte.</p>`;
      f.progress(i + 1, n, `${i + 1}/${n}`);
      f.foot.innerHTML = `<button class="btn btn-ghost btn-big" data-act="prev" ${i === 0 ? 'disabled' : ''}>${icon('left')} Zurück</button><span class="spacer"></span>${
        i < n - 1
          ? `<button class="btn btn-primary btn-big" data-act="next">Weiter ${icon('right')}</button>`
          : `<a class="btn btn-primary btn-big" href="#/thema/${tp.id}/karten">Zu den Karteikarten ${icon('right')}</a>`}`;
      const art = f.inner.querySelector('.info');
      swipeable(art, {
        move: (dx) => { art.style.transform = `translateX(${dx * 0.5}px)`; },
        end: (d) => {
          art.style.transform = '';
          if (d < 0) nav(1);
          else if (d > 0) nav(-1);
        },
      });
    }
    function nav(d) {
      const j = i + d;
      if (j < 0) return;
      if (j >= n) { go(`#/thema/${tp.id}/karten`); return; }
      Speech.stop();
      i = j;
      show(d);
      f.body.scrollTop = 0;
    }
    f.foot.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (a) nav(a.dataset.act === 'next' ? 1 : -1);
    });
    show(0);
    return {
      el: f.el,
      key(e) {
        if (e.key === 'ArrowRight') nav(1);
        if (e.key === 'ArrowLeft') nav(-1);
      },
    };
  }

  function flashDeck(tp) {
    const f = frame({ eyebrow: `${tp.titel} · Karteikarten`, closeHash: '#/wetter' });
    const cards = tp.fragen;
    const total = cards.length;
    let queue = shuffle(cards);
    let known = 0, flipped = false, fl = null;
    const firstTry = new Set();
    function show() {
      if (!queue.length) {
        f.progress(total, total, `${total}/${total}`);
        f.foot.innerHTML = '';
        Sound.play('done');
        f.inner.innerHTML = `<div class="result"><p class="eyebrow">${esc(tp.titel)} · Karteikarten</p><h2>Alle ${total} Karten gewusst!</h2>
          <p class="muted" style="max-width:52ch">Was du beim ersten Mal gewusst hast, zählt für deinen Lernstand. Weiter geht es mit den Aufgaben.</p>
          <div class="acts"><a class="btn btn-primary btn-big" href="#/thema/${tp.id}/ueben">Weiter zum Üben ${icon('right')}</a><button class="btn btn-ghost btn-big" data-act="again">${icon('redo')} Noch einmal</button></div></div>`;
        f.inner.querySelector('[data-act="again"]').addEventListener('click', () => render());
        return;
      }
      const card = queue[0];
      flipped = false;
      f.inner.innerHTML = `<p class="q-help" style="text-align:center">${known} von ${total} gewusst · Tippe auf die Karte, um sie umzudrehen.</p>
        <div class="flash-wrap slide-in-r"><div class="flash" role="button" tabindex="0" aria-label="Karte umdrehen">
          <div class="face front"><span class="eyebrow">Frage</span><p class="f-q">${esc(card.f)}</p><span class="f-hint">Überleg dir die Antwort, dann umdrehen.</span></div>
          <div class="face back"><span class="eyebrow">Antwort</span><p class="f-def">${esc(card.a)}</p></div>
        </div></div>
        <p class="swipe-hint">Nach rechts wischen: gewusst. Nach links: noch nicht.</p>`;
      f.progress(known, total, `${known}/${total}`);
      f.foot.innerHTML = `<button class="btn btn-ghost btn-big" data-act="no">${icon('left')} Noch nicht</button><span class="spacer"></span><button class="btn btn-primary btn-big" data-act="yes">Gewusst ${icon('right')}</button>`;
      fl = f.inner.querySelector('.flash');
      fl.addEventListener('click', () => { if (!justSwiped(fl)) flip(); });
      swipeable(fl, {
        move: (dx) => {
          fl.style.transition = 'none';
          fl.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)${flipped ? ' rotateY(180deg)' : ''}`;
        },
        end: (d) => {
          fl.style.transition = '';
          fl.style.transform = '';
          if (d) rate(d > 0);
        },
      });
    }
    function flip() {
      flipped = !flipped;
      fl.classList.toggle('is-flipped', flipped);
      Sound.play('flip');
    }
    function rate(yes) {
      const c = queue.shift();
      if (!firstTry.has(c.key)) {
        firstTry.add(c.key);
        mark(c.key, yes ? 'ok' : 'bad', 'deck');
        save();
      }
      if (yes) known++;
      else queue.splice(Math.min(queue.length, 3 + Math.floor(Math.random() * 3)), 0, c);
      show();
    }
    f.foot.addEventListener('click', (e) => {
      const a = e.target.closest('[data-act]');
      if (a) rate(a.dataset.act === 'yes');
    });
    show();
    return {
      el: f.el,
      key(e) {
        if (!queue.length) return;
        if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
        if (e.key === 'ArrowRight') rate(true);
        if (e.key === 'ArrowLeft') rate(false);
      },
    };
  }

  // ---------- Generalprobe und Fehler ----------
  function probeTasks(n) {
    const cnt = { na: Math.round(n * 0.35), sa: Math.round(n * 0.2), hu: Math.round(n * 0.2) };
    cnt.to = n - cnt.na - cnt.sa - cnt.hu;
    // Kartenpunkte reihum aus allen Kategorien, damit jede vorkommt
    const mapPick = (mid, k) => {
      const pools = MAPS[mid].kategorien.filter((c) => !c.ohneTest).map((c) => shuffle(pointsOf(mid, c.id)));
      const out = [];
      for (let i = 0; out.length < k && pools.some((p) => p.length); i++) {
        const pool = pools[i % pools.length];
        if (pool.length) out.push(pool.pop());
      }
      return shuffle(out).map((p) => ({ typ: 'schreib', id: p.id, key: p.id, teil: mid }));
    };
    const topicPick = (id, k) => shuffle(TOPIC[id].ueben).slice(0, k);
    return [...mapPick('na', cnt.na), ...mapPick('sa', cnt.sa), ...topicPick('hu', cnt.hu), ...topicPick('to', cnt.to)];
  }
  function taskForKey(k) {
    const p = POINTS[k];
    if (p) return { typ: ['was', 'wo', 'schreib'].includes(S.wrong[k]) ? S.wrong[k] : 'schreib', id: k, key: k, teil: p.map };
    return TASKS[k] || null;
  }
  function runPruefung(kind, arg) {
    if (kind === 'probe') {
      const n = arg === '40' ? 40 : 20;
      return taskRunner(probeTasks(n), { mode: 'probe', title: `Generalprobe · ${n} Aufgaben`, closeHash: '#/pruefung' });
    }
    if (kind === 'fehler') {
      const tasks = shuffle(wrongKeys(arg).map(taskForKey).filter(Boolean));
      return taskRunner(tasks, { mode: 'review', title: 'Fehler wiederholen', closeHash: '#/pruefung', backLabel: 'Zurück zur Generalprobe', emptyTitle: 'Keine Fehler offen', emptyText: 'Alles, was du zuletzt falsch hattest, sitzt jetzt. Stark!', resultNote: 'Was beim ersten Versuch klappt, verschwindet aus der Fehlerliste' });
    }
    if (kind === 'fallen') {
      const tasks = shuffle(FALLEN.map((f) => ({ typ: 'schreib', id: f.p.id, key: f.p.id, teil: f.p.map, falle: true })));
      return taskRunner(tasks, { title: 'Stolperwörter', closeHash: '#/pruefung', backLabel: 'Zurück zur Generalprobe' });
    }
    // Bunte Runde aus allen Bereichen
    const mapMix = (mid, k) => prioritize(pointsOf(mid), k).map((p) => ({ typ: pick(['was', 'wo', 'schreib']), id: p.id, key: p.id, teil: mid }));
    const tasks = shuffle([...mapMix('na', 5), ...mapMix('sa', 3), ...shuffle(TOPIC.hu.ueben).slice(0, 4), ...shuffle(TOPIC.to.ueben).slice(0, 4)]);
    return taskRunner(tasks, { title: 'Bunte Runde', closeHash: '#/pruefung', backLabel: 'Zurück zur Generalprobe' });
  }

  function viewPruefung() {
    const pr = S.probe;
    let n = 20;
    const byArea = AREAS.map((a) => ({ a, n: wrongKeys(a.id).length })).filter((x) => x.n);
    const wrong = wrongKeys().length;
    const el = h(`<div class="page">
      <header class="topbar"><div><p class="eyebrow">Wie im Test</p><h1>Generalprobe</h1></div>${gearBtn()}</header>
      <section class="card probe">
        <div class="probe-head"><div><h2>So läuft sie ab</h2><p class="muted">Aufgebaut wie ein Test: Teil 1 Nordamerika und Teil 2 Südamerika (Namen zu Nummern schreiben), Teil 3 Hurrikans und Teil 4 Tornados. Keine Tipps und keine zweite Chance. Am Ende siehst du, welcher Teil noch wackelt.</p></div>
          ${pr && pr.last ? `<div class="probe-best"><p class="eyebrow">Bestes Ergebnis</p><div class="big">${pct(pr.best, 1)} %</div><p class="small muted">Zuletzt am ${esc(deDate(pr.last.date))}: ${pr.last.right}/${pr.last.total}</p></div>` : ''}</div>
        <div class="set"><p class="eyebrow">Länge</p><div class="seg" role="group" aria-label="Länge"><button type="button" data-n="20" aria-pressed="true">Kurz · 20 Aufgaben</button><button type="button" data-n="40" aria-pressed="false">Lang · 40 Aufgaben</button></div></div>
        <a class="btn btn-primary btn-big start-probe" href="#/pruefung/probe/20">Generalprobe starten ${icon('right')}</a>
      </section>
      <div class="tiles">
        <section class="card tile"><p class="eyebrow">Fehler wiederholen</p><div class="big">${wrong} <span class="small muted">offen</span></div>
          <p class="small muted">${wrong ? byArea.map((x) => `${esc(x.a.titel)}: ${x.n}`).join(' · ') : 'Gerade ist nichts offen.'}</p>
          ${wrong ? '<a class="btn btn-ghost" href="#/pruefung/fehler">Alle Fehler wiederholen</a>' : ''}</section>
        <section class="card tile"><p class="eyebrow">Stolperwörter</p><div class="big">${FALLEN.length} <span class="small muted">Namen</span></div>
          <p class="small muted">Diese Namen waren auf deinem Arbeitsblatt falsch geschrieben oder fehlten, zum Beispiel ${FALLEN.slice(0, 3).map((f) => esc(f.richtig)).join(', ')}.</p>
          <a class="btn btn-ghost" href="#/pruefung/fallen">Stolperwörter schreiben</a></section>
        <section class="card tile"><p class="eyebrow">Bunte Runde</p><div class="big">16 <span class="small muted">Aufgaben</span></div>
          <p class="small muted">Von allem etwas, mit Tipps und zweiter Chance. Gut zum Aufwärmen.</p>
          <a class="btn btn-ghost" href="#/pruefung/mix">Bunte Runde starten</a></section>
      </div>
    </div>`);
    el.querySelector('.probe .seg').addEventListener('click', (e) => {
      const b = e.target.closest('[data-n]');
      if (!b) return;
      n = +b.dataset.n;
      el.querySelectorAll('.probe .seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      el.querySelector('.start-probe').setAttribute('href', `#/pruefung/probe/${n}`);
    });
    return el;
  }

  // ---------- Spickzettel ----------
  function viewSpick(tab) {
    const tabs = [['na', 'Nordamerika'], ['sa', 'Südamerika'], ['hu', 'Hurrikans'], ['to', 'Tornados'], ['fallen', 'Stolperwörter']];
    const cur = tabs.some(([k]) => k === tab) ? tab : 'na';
    let body = '';
    if (MAPS[cur]) {
      const m = MAPS[cur];
      body = `<p class="muted">Alle Namen der stummen Karte ${esc(m.titel)}. Mit „Abdecken“ kannst du dich selbst abfragen: Tippe auf eine Zeile, um den Namen aufzudecken.</p>
        <div class="row"><button type="button" class="btn btn-ghost btn-sm" data-act="cover">${icon('eyeoff')} Abdecken</button></div>
        <div class="spick-grid">${m.kategorien.map((c) => `<section class="card spick-cat${c.ohneTest ? ' is-notest' : ''}"><h2 class="h2-sm"><span class="kat-dot kat-${c.id}"></span>${esc(c.label)} <span class="muted small">${esc(c.zeichen)}${c.ohneTest ? ' · kommt nicht im Test' : ''}</span></h2>
          <div class="sp-list">${m.punkte.filter((p) => p.kat === c.id).map((p) => `<button type="button" class="sp-row" data-id="${p.id}">${lbl(p)}<span class="sp-name">${esc(pname(p))}</span><span class="sp-cover">antippen</span><span class="sp-info small muted">${esc(p.info || '')}</span></button>`).join('')}</div></section>`).join('')}</div>`;
    } else if (TOPIC[cur]) {
      const tp = TOPIC[cur];
      const steps = tp.karten.filter((k) => k.schritt);
      const rest = tp.karten.filter((k) => !k.schritt);
      body = `<div class="spick-topic">
        <section class="card"><div class="topic-head"><img src="${IMG[tp.bild]}" alt="" width="96" height="96"><div><p class="eyebrow">${esc(tp.untertitel)}</p><h2>${esc(tp.titel)}</h2></div></div>
          <ul class="merk-list">${rest.map((k) => `<li><strong>${esc(k.titel)}:</strong> ${esc(k.merke)}</li>`).join('')}</ul></section>
        <section class="card"><h2 class="h2-sm">Entstehung in ${steps.length} Schritten</h2><ol class="ablauf">${steps.map((k) => `<li><span class="ab-n">${k.schritt}</span><span>${esc(k.merke)}</span></li>`).join('')}</ol></section>
        ${cur === 'to' ? `<section class="card"><h2 class="h2-sm">Hurrikan oder Tornado?</h2>${vergleichTable()}</section>` : ''}
      </div>`;
    } else {
      body = `<p class="muted">Diese Namen waren auf dem Arbeitsblatt falsch geschrieben oder fehlten. Im Test zählt die richtige Schreibweise.</p>
        <section class="card"><div class="table-wrap"><table class="results fallen-t"><thead><tr><th>Karte</th><th>Nr.</th><th>Auf dem Blatt</th><th>Richtig</th></tr></thead><tbody>${FALLEN.map((f) => `<tr><td>${esc(MAPS[f.karte].titel)}</td><td>${lbl(f.p)}</td><td class="strike">${esc(f.falsch)}</td><td><strong>${esc(f.richtig)}</strong></td></tr>`).join('')}</tbody></table></div>
        <p style="margin-top:14px"><a class="btn btn-primary" href="#/pruefung/fallen">Stolperwörter schreiben ${icon('right')}</a></p></section>`;
    }
    const el = h(`<div class="page">
      <header class="topbar"><div><p class="eyebrow">Alles auf einen Blick</p><h1>Spickzettel</h1></div>${gearBtn()}</header>
      <div class="seg tab-seg" role="tablist">${tabs.map(([k, l]) => `<a role="tab" href="#/spick/${k}" aria-selected="${k === cur}">${esc(l)}</a>`).join('')}</div>
      ${body}
    </div>`);
    let covered = false;
    el.addEventListener('click', (e) => {
      const c = e.target.closest('[data-act="cover"]');
      const r = e.target.closest('.sp-row');
      if (c) {
        covered = !covered;
        el.classList.toggle('is-covered', covered);
        el.querySelectorAll('.sp-row.is-open').forEach((x) => x.classList.remove('is-open'));
        c.innerHTML = covered ? `${icon('eye')} Aufdecken` : `${icon('eyeoff')} Abdecken`;
      } else if (r && covered) r.classList.toggle('is-open');
    });
    return el;
  }

  // ---------- Einstellungen ----------
  function viewSettings() {
    const el = h(`<div class="page">
      <header class="topbar"><div><p class="eyebrow">Geo-Check Amerika</p><h1>Einstellungen</h1></div><a class="icon-btn" href="#/start" aria-label="Schließen">${icon('close')}</a></header>
      <div class="set-list">
        <section class="card set"><h2>Dein Name</h2><div class="row"><input id="set-name" class="input" style="flex:1 1 220px" maxlength="30" value="${esc(S.name)}" placeholder="Vorname" autocomplete="given-name"><button class="btn btn-ghost" data-act="name">Speichern</button></div></section>
        <section class="card set"><h2>Testtermin</h2><p class="small muted">Für den Countdown auf der Startseite.</p><div class="row"><input id="set-date" class="input" style="flex:0 1 240px" type="date" value="${esc(S.examDate || '')}"><button class="btn btn-ghost" data-act="date">Speichern</button></div></section>
        <section class="card set"><h2>Schriftgröße</h2><div class="seg" role="group" aria-label="Schriftgröße">${[['S', 'Klein'], ['M', 'Normal'], ['L', 'Groß']].map(([k, l]) => `<button data-font="${k}" aria-pressed="${S.settings.font === k}">${l}</button>`).join('')}</div></section>
        <section class="card set"><div class="switch"><div><h2>Töne</h2><p class="small muted">Kurze Signale bei richtigen und falschen Antworten.</p></div><button class="toggle" data-act="sound" aria-pressed="${S.settings.sound}" aria-label="Töne an oder aus"></button></div></section>
        <section class="card set"><h2>Lernstand zurücksetzen</h2><p class="small muted">Löscht alle Ergebnisse auf diesem Gerät. Das lässt sich nicht rückgängig machen.</p><div><button class="btn btn-danger" data-act="reset">Alles zurücksetzen</button></div></section>
        <p class="small muted">Der Lernstand wird nur auf diesem Gerät gespeichert. Karten aus deinem Geo-Heft, Inhalte nach deinen Heftnotizen.</p>
      </div>
    </div>`);
    let armed = false;
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act], [data-font]');
      if (!b) return;
      if (b.dataset.font) {
        S.settings.font = b.dataset.font;
        applySettings();
        save();
        el.querySelectorAll('[data-font]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        return;
      }
      const act = b.dataset.act;
      if (act === 'name') { S.name = el.querySelector('#set-name').value.trim().slice(0, 30); S.introDone = true; save(); toast('Name gespeichert.'); }
      if (act === 'date') {
        const v = el.querySelector('#set-date').value;
        if (/^\d{4}-\d{2}-\d{2}$/.test(v)) { S.examDate = v; save(); toast('Testtermin gespeichert.'); }
        else toast('Bitte ein Datum auswählen.');
      }
      if (act === 'sound') { S.settings.sound = !S.settings.sound; b.setAttribute('aria-pressed', String(S.settings.sound)); save(); }
      if (act === 'reset') {
        if (!armed) {
          armed = true;
          b.classList.add('is-armed');
          b.textContent = 'Wirklich alles löschen? Nochmal tippen';
          setTimeout(() => { armed = false; b.classList.remove('is-armed'); b.textContent = 'Alles zurücksetzen'; }, 4000);
          return;
        }
        S = fresh();
        save();
        applySettings();
        toast('Lernstand gelöscht.');
        go('#/start');
      }
    });
    return el;
  }

  // ---------- Start ----------
  applySettings();
  window.addEventListener('hashchange', render);
  render();
})();
</script>
